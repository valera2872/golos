name: Build Nightseed 0.28.4 UX APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.4 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v284.log) 2>&1

          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v281.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v281.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          bash /tmp/restore-nightseed-v281.sh

          cat source-v284/patch_* > buildsrc/v281-to-v284.patch.gz.b64
          test "$(wc -c < buildsrc/v281-to-v284.patch.gz.b64)" -eq 45804
          echo 'a261069e290a91df844d876922e27f66dd1d365a67fd604e3046dc1858e5c1d7  source-v284/patch_000' | sha256sum -c -
          echo '49fdef6b416f0d53ddf02a10e447e3c3fd535787f77a23249464745b05141f28  source-v284/patch_001' | sha256sum -c -
          echo '96547f69b0c2ffedea6277285480ee664b57340a3d4a411c43a51e8029b96d13  source-v284/patch_002' | sha256sum -c -
          echo 'cb3f2ad3c3b830c0e0b6c535f5dee65b5bca777abaa34069ba75baf254acb9c5  source-v284/patch_003' | sha256sum -c -
          base64 --decode buildsrc/v281-to-v284.patch.gz.b64 | gunzip > buildsrc/v281-to-v284.patch
          echo 'fde53bb4cef024d80bcfb8cc732a526b82c74fe2beed8b180a6ced64da5e770b  buildsrc/v281-to-v284.patch' | sha256sum -c -

          # Proven night-recognition core is frozen for this UX experiment.
          ! grep -q 'NightCaptureService.java' buildsrc/v281-to-v284.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v281-to-v284.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v281-to-v284.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v281-to-v284.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v281-to-v284.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v281-to-v284.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          # 0.28.4 no longer exposes the synthetic nature loops.
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/rain_soft.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/ocean_swell.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/forest_evening.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/stream_flow.ogg

          # Hosted CI cannot fetch the user's Pixabay masters. Build with tiny valid
          # placeholders; exact original MP3 bytes are injected into the test APK afterward.
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p buildsrc/quiet-diary/app/src/main/res/raw
          for name in music_sea_harp music_calm_energy music_quiet_meditation; do
            ffmpeg -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 \
              -c:a libmp3lame -b:a 64k "buildsrc/quiet-diary/app/src/main/res/raw/${name}.mp3"
          done

          grep -q 'versionCode = 284' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.4"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'class SelfSuggestionActivity' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java
          grep -q 'KEY_REPETITIONS' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'ORDER_MUSIC_THEN_SUGGESTION' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightProgramService.java
          grep -q 'Начать ночную программу' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightProgramActivity.java
          grep -q 'доминантой' buildsrc/quiet-diary/app/src/main/res/layout/activity_self_suggestion.xml
          grep -q 'Я проснулся — больше не повторять' buildsrc/quiet-diary/app/src/main/res/layout/activity_wake_alarm.xml
          grep -q 'Будить каждый день' buildsrc/quiet-diary/app/src/main/res/layout/activity_wake_settings.xml

          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PYXML

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.4-restore-log
          path: buildsrc/restore-v284.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain > buildsrc/gradle-build-v284.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.4-compiler-log
          path: buildsrc/gradle-build-v284.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare placeholder APK
        run: cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.4-placeholder-debug.apk

      - name: Upload placeholder APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.4-placeholder-debug-apk
          path: Nightseed-0.28.4-placeholder-debug.apk
          if-no-files-found: error
          retention-days: 7
