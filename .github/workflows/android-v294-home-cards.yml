name: Build Somnori 0.29.4 home cards fix

on:
  pull_request:
    branches: [ agent/v0-29-1-voice-alarm ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.29.3 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v293-home.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.29.2 project',
              'Apply Somnori 0.29.3 home workspace',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              path = Path(f'/tmp/v294-base-{n}.sh')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(path)], check=True)
          PY
          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java > /tmp/v294-frozen-recognition.sha256

      - name: Fix Practice and Before Sleep card visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v294/apply_home_cards_fix.py
          cd buildsrc/quiet-diary
          grep -q 'versionCode = 2904' app/build.gradle.kts
          grep -q 'versionName = "0.29.4"' app/build.gradle.kts
          grep -q 'dashboardPracticeCard' app/src/main/res/layout/activity_main.xml
          grep -q 'dashboardBeforeSleepCard' app/src/main/res/layout/activity_main.xml
          grep -q 'android:minHeight="178dp"' app/src/main/res/layout/activity_main.xml

          # UI hotfix only: all recognition/alarm code remains byte-identical to 0.29.3/0.29.2.
          sha256sum -c /tmp/v294-frozen-recognition.sha256
          grep -q 'SAFE_END_SILENCE_BLOCKS = 11' app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java
          ! grep -q 'transcribeSamplesFast' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'alarmDetector = new AcousticWakeDetector' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'private static final long PAUSE_MS = 3000L;' app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'private static final long COUE_PAUSE_MS = 3000L;' app/src/main/java/com/quietdiary/app/NightProgramService.java

          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('app/src/main/res')
          for p in root.rglob('*.xml'):
              ET.parse(p)
          main = (root/'layout/activity_main.xml').read_text(encoding='utf-8')
          for card_id in ('dashboardPracticeCard', 'dashboardBeforeSleepCard'):
              marker = f'android:id="@+id/{card_id}"'
              pos = main.index(marker)
              block = main[pos:pos+380]
              assert 'android:layout_height="wrap_content"' in block, card_id
              assert 'android:minHeight="178dp"' in block, card_id
              assert 'android:layout_height="match_parent"' not in block, card_id
          for expected in ['Практики', 'Перед сном', 'Ночной помощник', 'Сегодня ночью', 'Мои сны']:
              assert expected in main, expected
          for p in (root/'layout').rglob('*.xml'):
              text = p.read_text(encoding='utf-8')
              for block in re.findall(r'<com\.google\.android\.material\.button\.MaterialButton\b.*?/>', text, re.S):
                  assert not re.search(r'android:layout_height="\d+dp"', block), f'fixed-height button: {p.name}'
          print('Somnori 0.29.4 layout visibility guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          for entry in res/raw/music_sea_harp.mp3 res/raw/music_calm_energy.mp3 res/raw/music_quiet_meditation.mp3 res/raw/nature_forest.mp3; do
            unzip -l "$APK" "$entry" | grep -q "$entry"
          done
          cp "$APK" Somnori-0.29.4-home-cards-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.29.4-home-cards-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.4-home-cards-debug-apk
          path: Somnori-0.29.4-home-cards-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.4-home-cards-source
          path: Somnori-0.29.4-home-cards-source.zip
          retention-days: 14
