name: Build Nightseed 0.25.7 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.7 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v257.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v256.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.6 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v256.sh').write_text(script, encoding='utf-8')
          PY
          if ! bash /tmp/restore-nightseed-v256.sh; then
            echo 'Nightseed 0.25.6 restoration failed:'
            cat buildsrc/restore-v256.log 2>/dev/null || true
            exit 1
          fi

          test "$(wc -c < source-v257/v256-to-v257.patch.gz.b64)" -eq 6481
          echo '8c9656b3c60a81119a07a0ebd75dbed38a5a8f4bf553fd6861eeb54dcf8d6d96  source-v257/v256-to-v257.patch.gz.b64' | sha256sum -c -
          base64 --decode source-v257/v256-to-v257.patch.gz.b64 | gunzip > buildsrc/v256-to-v257.patch
          echo '4f432fb4df74f1d4694cb22a135b3844db5a54cb14e06e68cd857d508ab35bf8  buildsrc/v256-to-v257.patch' | sha256sum -c -

          # Keep the proven recognition and audio pipeline unchanged in this UX-only release.
          ! grep -q 'NightCaptureService.java' buildsrc/v256-to-v257.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v256-to-v257.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v256-to-v257.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v256-to-v257.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v256-to-v257.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v256-to-v257.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 257' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.25.7"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'PAGE_COUNT = 6' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/OnboardingActivity.java
          grep -q 'ОДНА КОМАНДА ЗА РАЗ' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/OnboardingActivity.java
          grep -q 'РАЗМЕЩЕНИЕ ТЕЛЕФОНА' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/OnboardingActivity.java
          grep -q 'onboarding_v257_seen' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/MainActivity.java
          grep -q 'Во время записи  ·  «Сохранить» / «Отменить»' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/MainActivity.java
          grep -q 'Новую команду — только после тройной вибрации' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
          grep -q 'На полу за краем кровати распознавание может быть хуже' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
          grep -q 'не на пол за краем кровати' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'Не объединяйте несколько команд в одну фразу' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PY

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.7-restore-log
          path: buildsrc/restore-v257.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v257.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.7-compiler-log
          path: buildsrc/gradle-build-v257.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.7-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.7-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.25.7-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.7-debug-apk
          path: Nightseed-0.25.7-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.7-release-unsigned-apk
          path: Nightseed-0.25.7-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.7-restored-source
          path: nightseed-0.25.7-restored-source.zip
          if-no-files-found: error
          retention-days: 7
