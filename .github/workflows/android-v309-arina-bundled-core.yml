name: Build Somnori 0.30.9 Arina Bundled Core

on:
  pull_request:
    branches: [ agent/v0-30-5-ru-ui-state-reliability ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.30.6 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v306-voice-lab.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.30.5 source',
              'Apply Voice Lab and shared TTS profile',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              p = Path(f'/tmp/v309-base-{n}.sh')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(p)], check=True)
          PY
          cd buildsrc/quiet-diary
          grep -q 'versionCode = 30060' app/build.gradle.kts
          grep -q 'versionName = "0.30.6-voice-lab"' app/build.gradle.kts

      - name: Prepare CI placeholder for private prototype audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path('buildsrc/v309/arina_core_v1.zip')
          p.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(p, 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('CI_PLACEHOLDER.txt', 'Prototype audio is injected only into the local test APK.\n')
          PY

      - name: Apply bundled Arina runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v309/apply_v309.py
          cd buildsrc/quiet-diary
          grep -q 'versionCode = 30090' app/build.gradle.kts
          grep -q 'versionName = "0.30.9-arina-bundled-core"' app/build.gradle.kts
          test -s app/src/main/assets/arina_core_v1.zip
          grep -q 'ArinaVoicePack.ensureInstalled(this)' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'PHRASE_SAVED_THOUGHT' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'PHRASE_SAVED_DREAM' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'PHRASE_CANCELLED' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'PHRASE_SLEEP_WELL' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'previewArinaCurrentTime' app/src/main/java/com/quietdiary/app/VoiceLabActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare scaffold APK
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.30.9-arina-bundled-core-scaffold.apk

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.9-arina-bundled-core-scaffold
          path: Somnori-0.30.9-arina-bundled-core-scaffold.apk
          retention-days: 14
