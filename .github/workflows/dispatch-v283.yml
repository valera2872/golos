name: Dispatch Nightseed 0.28.3

# Existing workflow touched intentionally to dispatch the 0.28.3 build.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dispatch-v283.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 0.28.3 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-v283.yml/dispatches \
            -d '{"ref":"main"}'
