name: Build Nightseed 0.25.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.1 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v25.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v25.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/restore-nightseed-v25.sh
          {
            cat source-v251/chunk*.b64 > buildsrc/v25-to-v251.patch.gz.b64
            test "$(wc -c < buildsrc/v25-to-v251.patch.gz.b64)" -eq 18240
            echo 'ca76988a79e9c7025eda91f38140fe77a0c03c6882195889971fa7a9891badc1  buildsrc/v25-to-v251.patch.gz.b64' | sha256sum -c -
            base64 --decode buildsrc/v25-to-v251.patch.gz.b64 | gunzip > buildsrc/v25-to-v251.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v25-to-v251.patch
            find buildsrc/quiet-diary -name '*.orig' -delete
            test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

            grep -q 'versionName = "0.25.1"' buildsrc/quiet-diary/app/build.gradle.kts
            grep -q 'transcribeSamplesFast' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
            grep -q 'new AcousticWakeDetector(wakeTemplates, wakeStoredThreshold, true)' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
            grep -q 'nightSessionId' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/Entry.java
            grep -q 'nightTimelineContainer' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
            grep -q 'Вечерняя практика по Эмилю Куэ' buildsrc/quiet-diary/app/src/main/res/layout/activity_coue_practice.xml
            grep -q 'Использовать классическую формулу' buildsrc/quiet-diary/app/src/main/res/layout/activity_coue_practice.xml
            grep -q 'LoudnessEnhancer' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java

            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('buildsrc/quiet-diary/app/src/main/res/layout')
          for path in root.glob('*.xml'):
              ET.parse(path)
          PY
          } >> buildsrc/restore.log 2>&1

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.1-restore-log
          path: buildsrc/restore.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.1-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.1-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.1-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.1-debug-apk
          path: Nightseed-0.25.1-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.1-release-unsigned-apk
          path: Nightseed-0.25.1-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
