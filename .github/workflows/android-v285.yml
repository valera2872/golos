name: Build Nightseed 0.28.5 UX APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, agent/v0-28-4-night-ux ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.4 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          lines = Path('.github/workflows/android-v284.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.4 project'
          start = lines.index(marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
          Path('/tmp/restore-v284.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/restore-v284.sh

      - name: Apply 0.28.5 UX patch
        shell: bash
        run: |
          set -euo pipefail
          cat source-v285/b64_00 source-v285/b64_01 source-v285/b64_02 source-v285/b64_03 > /tmp/v285.patch.gz.b64
          base64 -d /tmp/v285.patch.gz.b64 | gzip -d > buildsrc/v284-to-v285.patch
          ! grep -Eq '^diff --git a/app/src/main/java/com/quietdiary/app/(NightCaptureService.java|GoogleSpeechTranscriber.kt|AcousticWakeDetector.java|LiveCommandRecognizer.kt|WakeTemplateStore.java|CouePracticeService.java) ' buildsrc/v284-to-v285.patch
          cd buildsrc/quiet-diary
          git apply --check ../v284-to-v285.patch
          git apply ../v284-to-v285.patch

      - name: Normalize legacy Material attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('buildsrc/quiet-diary/app/src/main/res/layout')
          style_changed = 0
          tint_changed = 0
          for path in root.glob('*.xml'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('style="?attr/materialButtonTextButtonStyle"', '')
              if new != text:
                  style_changed += 1
              newer = new.replace('app:thumbTint=', 'android:thumbTint=').replace('app:trackTint=', 'android:trackTint=')
              if newer != new:
                  tint_changed += 1
              if newer != text:
                  path.write_text(newer, encoding='utf-8')
          print('Legacy text-button styles removed from:', style_changed, 'layouts')
          print('Switch tint attrs normalized in:', tint_changed, 'layouts')
          PY

      - name: Validate UX resources
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '?attr/materialButtonTextButtonStyle' buildsrc/quiet-diary/app/src/main/res/layout
          ! grep -q 'R.raw.rain_soft' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundscapeService.java
          grep -q 'versionName = "0.28.5"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'Начать практику' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java
          grep -q 'Я проснулся' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeAlarmActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('buildsrc/quiet-diary/app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          print('XML OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee buildsrc/gradle-build-v285.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.5-compiler-log
          path: buildsrc/gradle-build-v285.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare placeholder APK
        run: cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.5-placeholder-debug.apk

      - name: Upload placeholder APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.5-placeholder-debug-apk
          path: Nightseed-0.28.5-placeholder-debug.apk
          if-no-files-found: error
          retention-days: 7
