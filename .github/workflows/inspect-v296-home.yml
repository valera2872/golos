name: Inspect exact Somnori 0.29.6 home

on:
  pull_request:
    branches: [ agent/v0-29-1-voice-alarm ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.29.6 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v296-premium-night-console.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.29.5 project',
              'Apply Somnori 0.29.6 premium visuals and night console',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              path = Path(f'/tmp/v296-inspect-{n}.sh')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(path)], check=True)
          PY

      - name: Print home layout and visual resources
        shell: bash
        run: |
          ROOT=buildsrc/quiet-diary/app/src/main/res
          echo '===== ACTIVITY_MAIN_XML_BEGIN ====='
          cat "$ROOT/layout/activity_main.xml"
          echo '===== ACTIVITY_MAIN_XML_END ====='
          echo '===== BOTTOM_NAV_BEGIN ====='
          cat "$ROOT/layout/view_bottom_navigation.xml"
          echo '===== BOTTOM_NAV_END ====='
          for f in somnori_brand_header_background somnori_assistant_card_background somnori_practice_card_background somnori_sleep_card_background somnori_dream_card_background somnori_alarm_banner_background somnori_tonight_card_background; do
            echo "===== ${f}_BEGIN ====="
            cat "$ROOT/drawable/${f}.xml"
            echo "===== ${f}_END ====="
          done
          echo '===== SCENE_ASSETS ====='
          file "$ROOT"/drawable-nodpi/somnori_*.webp
          identify "$ROOT"/drawable-nodpi/somnori_*.webp 2>/dev/null || true
          echo '===== MAIN_ACTIVITY_REFS_BEGIN ====='
          grep -nE 'dashboard|somnori|nightLivePanel|openNightAssistant|bottom' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/MainActivity.java || true
          echo '===== MAIN_ACTIVITY_REFS_END ====='
