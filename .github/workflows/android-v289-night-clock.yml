          base64 -d /tmp/v288-to-v289.patch.gz.b64 > /tmp/v288-to-v289.patch.gz
          gzip -dc /tmp/v288-to-v289.patch.gz > /tmp/v288-to-v289.patch
          cd buildsrc/quiet-diary
          patch -p3 < /tmp/v288-to-v289.patch

          # Acceptance guards: a bedtime program can no longer finish before night capture starts.
          grep -q 'versionCode = 289' app/build.gradle.kts
          grep -q 'versionName = "0.28.9"' app/build.gradle.kts
          grep -q 'putBoolean(KEY_AUTO_NIGHT, true)' app/src/main/java/com/quietdiary/app/NightProgramService.java
          grep -q 'return body + " → ночной режим"' app/src/main/java/com/quietdiary/app/NightProgramService.java
          ! grep -q 'if (!autoNight)' app/src/main/java/com/quietdiary/app/NightProgramService.java
          ! grep -R -q 'nightCaptureSwitch' app/src/main
          grep -q 'WakeTemplateStore.timeCount(this) < WakeTemplateStore.REQUIRED_TIME_SAMPLES' app/src/main/java/com/quietdiary/app/NightProgramActivity.java

          # Clock reliability guard: acoustic clock hits always reach the strict text verifier.
          python3 - <<'PY2'
          from pathlib import Path
          s = Path('app/src/main/java/com/quietdiary/app/NightCaptureService.java').read_text(encoding='utf-8')
          area = s[s.index('if (timeDetector != null)'):s.index('boolean matched = wakeDetector.accept')]
          assert 'startTimeTextVerification(timeCandidate)' in area
          assert 'candidateLooksLikeTime(this, timeCandidate)' not in area
          assert 'answerCurrentTimeByVoice' in s
          assert 'restartAudioInput();' in s[s.index('private void answerCurrentTimeByVoice'):s.index('private void pauseAudioInputForSpeech')]
          print('Night handoff + voice clock guards: OK')
          PY2

          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          print('XML validation: OK')
          PY2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.9-night-clock-debug.apk
          cd buildsrc
          zip -qr ../Nightseed-0.28.9-restored-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.9-night-clock-debug-apk
          path: Nightseed-0.28.9-night-clock-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.9-restored-source
          path: Nightseed-0.28.9-restored-source.zip
          retention-days: 14
