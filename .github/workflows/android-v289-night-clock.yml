name: Build Nightseed 0.28.9 night handoff + clock

on:
  pull_request:
    branches: [ agent/v0-28-5-ux-fix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.8 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/android-v288-practice-fix.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name, output):
              marker = f'      - name: {step_name}'
              start = lines.index(marker)
              run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
              Path(output).write_text(script, encoding='utf-8')

          extract('Restore Nightseed 0.28.6 project', '/tmp/run-v288-restore.sh')
          extract('Apply 0.28.8 practice fixes and visual rollback', '/tmp/run-v288-apply.sh')
          PY2
          bash /tmp/run-v288-restore.sh
          bash /tmp/run-v288-apply.sh

      - name: Apply 0.28.9 mandatory night handoff and voice clock fix
