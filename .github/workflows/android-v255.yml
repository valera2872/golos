name: Build Nightseed 0.25.5 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.5 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v255.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v254.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.4 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v254.sh').write_text(script, encoding='utf-8')
          PY
          if ! bash /tmp/restore-nightseed-v254.sh; then
            echo 'Nightseed 0.25.4 restoration failed:'
            cat buildsrc/restore-v254.log 2>/dev/null || true
            exit 1
          fi

          cat source-v255/chunk000.b64 source-v255/chunk001.b64 \
              source-v255/chunk002.b64 source-v255/chunk003.b64 \
              > buildsrc/v254-to-v255.patch.gz.b64
          test "$(wc -c < buildsrc/v254-to-v255.patch.gz.b64)" -eq 18041
          echo '8b899ac27abbc13240f4cf2051594ef382a150865915c043fdcc81d32b0b853a  buildsrc/v254-to-v255.patch.gz.b64' | sha256sum -c -
          base64 --decode buildsrc/v254-to-v255.patch.gz.b64 | gunzip > buildsrc/v254-to-v255.patch

          # The night detector and its proven verifier are outside this release by design.
          ! grep -q 'NightCaptureService.java' buildsrc/v254-to-v255.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v254-to-v255.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v254-to-v255.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v254-to-v255.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v254-to-v255.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 255' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.25.5"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'class CouePracticeService' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'WAIT_TIMEOUT_MS = 30L \* 60L \* 1000L' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'PARTIAL_WAKE_LOCK' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'REPETITIONS = 20' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'REQUIRED_SAMPLES = 3' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CoueStartTemplateStore.java
          grep -q 'coue_start_templates_v1' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CoueStartTemplateStore.java
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' buildsrc/quiet-diary/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="microphone|mediaPlayback"' buildsrc/quiet-diary/app/src/main/AndroidManifest.xml
          ! grep -q 'SpeechRecognizer' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PY

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.5-restore-log
          path: buildsrc/restore-v255.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v255.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.5-compiler-log
          path: buildsrc/gradle-build-v255.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.5-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.5-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.25.5-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.5-debug-apk
          path: Nightseed-0.25.5-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.5-release-unsigned-apk
          path: Nightseed-0.25.5-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.5-restored-source
          path: nightseed-0.25.5-restored-source.zip
          if-no-files-found: error
          retention-days: 7
