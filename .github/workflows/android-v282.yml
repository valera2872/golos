name: Build Nightseed 0.28.2 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.2 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v282.log) 2>&1

          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/android-v281.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v281.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          if ! bash /tmp/restore-nightseed-v281.sh; then
            echo 'Nightseed 0.28.1 restoration failed'
            exit 1
          fi

          cat source-v282/patch_* > buildsrc/v281-to-v282.patch.gz.b64
          test "$(wc -c < buildsrc/v281-to-v282.patch.gz.b64)" -eq 5076
          echo 'a73516ba9bcd8263f7f8d09085feae335bcec99f17620cb819a7d80c94efed1d  source-v282/patch_000' | sha256sum -c -
          echo '7ac6603532472b3fb4839e1e04ef81335cb09bc4acd063a563d328ade1ab4738  source-v282/patch_001' | sha256sum -c -
          base64 --decode buildsrc/v281-to-v282.patch.gz.b64 | gunzip > buildsrc/v281-to-v282.patch
          echo 'd66f8672255d74439d04f7091fe31dbe1beadf909a54d9ad57f25eb474cf34f2  buildsrc/v281-to-v282.patch' | sha256sum -c -

          ! grep -q 'NightCaptureService.java' buildsrc/v281-to-v282.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v281-to-v282.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v281-to-v282.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v281-to-v282.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          rm -f buildsrc/quiet-diary/app/src/main/res/raw/rain_soft.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/ocean_swell.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/forest_evening.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/stream_flow.ogg

          # Three starter tracks. We keep the source MP3 stream: no transcoding,
          # no resampling and no bitrate reduction.
          python3 -m pip install --quiet yt-dlp
          RAW='buildsrc/quiet-diary/app/src/main/res/raw'
          mkdir -p "$RAW"

          yt-dlp --no-playlist --no-progress -f ba \
            -o "$RAW/calm_energy.mp3" \
            'https://audio.com/xuan-lethithanhsnvbt/audio/calm-energy-meditation-888hz-peaceful-231909'

          yt-dlp --no-playlist --no-progress -f ba \
            -o "$RAW/quiet_meditation.mp3" \
            'https://audio.com/chandani/audio/music-for-relax-yoga-meditation-7783'

          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
            -o "$RAW/gentle_nature.mp3" \
            'https://rituels-quatre-saisons.fr/wp-content/uploads/2024/06/meditation-and-gentle-nature-184572.mp3'

          python3 - <<'PYCHECK'
          from pathlib import Path
          import subprocess
          raw = Path('buildsrc/quiet-diary/app/src/main/res/raw')
          expected = {
              'gentle_nature.mp3': (600.03, 18_000_000),
              'calm_energy.mp3': (240.02, 7_000_000),
              'quiet_meditation.mp3': (385.23, 11_000_000),
          }
          for name, (seconds, min_size) in expected.items():
              path = raw / name
              if not path.exists() or path.stat().st_size < min_size:
                  raise SystemExit(f'{name}: missing or unexpectedly small')
              text = subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','a:0',
                  '-show_entries','stream=codec_name,bit_rate:format=duration',
                  '-of','default=noprint_wrappers=1',str(path)
              ], text=True)
              data = dict(line.split('=',1) for line in text.splitlines() if '=' in line)
              print(name, path.stat().st_size, data)
              if data.get('codec_name') != 'mp3':
                  raise SystemExit(f'{name}: not MP3')
              duration = float(data.get('duration','0'))
              if abs(duration-seconds) > 4:
                  raise SystemExit(f'{name}: unexpected duration {duration}')
              bitrate = int(data.get('bit_rate','0') or 0)
              if bitrate and bitrate < 240000:
                  raise SystemExit(f'{name}: bitrate unexpectedly low {bitrate}')
          PYCHECK

          grep -q 'versionCode = 282' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.2"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'R.raw.gentle_nature' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'R.raw.calm_energy' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'R.raw.quiet_meditation' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'Природа и медитация' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          grep -q 'Спокойная энергия' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          grep -q 'Тихая медитация' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          ! grep -R -q 'R.raw.rain_soft\|R.raw.ocean_swell\|R.raw.forest_evening\|R.raw.stream_flow' buildsrc/quiet-diary/app/src/main/java

          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for folder in ('layout','drawable'):
              for path in Path(f'buildsrc/quiet-diary/app/src/main/res/{folder}').glob('*.xml'):
                  ET.parse(path)
          PYXML

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-restore-log
          path: buildsrc/restore-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v282.log 2>&1

      - name: Upload compiler log
        if: steps.restore.outcome != 'failure' && always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-compiler-log
          path: buildsrc/gradle-build-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.2-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.28.2-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.28.2-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-debug-apk
          path: Nightseed-0.28.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-release-unsigned-apk
          path: Nightseed-0.28.2-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-restored-source
          path: nightseed-0.28.2-restored-source.zip
          if-no-files-found: error
          retention-days: 7
