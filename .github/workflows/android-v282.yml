name: Build Nightseed 0.28.2 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.2 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v282.log) 2>&1

          # Reuse the already-proven 0.28.1 reconstruction verbatim.
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/android-v281.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v281.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          if ! bash /tmp/restore-nightseed-v281.sh; then
            echo 'Nightseed 0.28.1 restoration failed:'
            cat buildsrc/restore-v281.log 2>/dev/null || true
            exit 1
          fi

          cat source-v282/patch_* > buildsrc/v281-to-v282.patch.gz.b64
          test "$(wc -c < buildsrc/v281-to-v282.patch.gz.b64)" -eq 4936
          echo 'ff2e1a97acb9360c47a25d64753bf562a1ea07b5758ddad3a87da0f0d63b00af  source-v282/patch_000' | sha256sum -c -
          echo '8367f527c226ce7b73723f42b113fb9c8a8f535b16776617b705e6a5808160b8  source-v282/patch_001' | sha256sum -c -
          base64 --decode buildsrc/v281-to-v282.patch.gz.b64 | gunzip > buildsrc/v281-to-v282.patch
          echo 'a2f1e726d82cfef20a4190f135b14a21cf3e45828e4d61fdfa36453e0043f52c  buildsrc/v281-to-v282.patch' | sha256sum -c -

          # Proven night recognition is frozen. Any accidental edit fails before compilation.
          ! grep -q 'NightCaptureService.java' buildsrc/v281-to-v282.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v281-to-v282.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v281-to-v282.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v281-to-v282.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          # 0.28.1's synthetic nature sounds were rejected in listening tests.
          # Remove them completely from this build before adding the three real tracks.
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/rain_soft.ogg
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/ocean_swell.ogg
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/forest_evening.ogg
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/stream_flow.ogg

          # Keep the source MP3 stream: no transcoding, resampling or bitrate reduction.
          python3 -m pip install --quiet requests yt-dlp
          python3 - <<'PYMUSIC'
          from pathlib import Path
          import html, re, subprocess, sys
          import requests

          out_dir = Path('buildsrc/quiet-diary/app/src/main/res/raw')
          out_dir.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          tracks = [
              ('sea_harp', 'https://pixabay.com/music/modern-classical-beside-the-sea-harp-and-ocean-525286/', 183, 4_500_000),
              ('calm_energy', 'https://pixabay.com/music/meditationspiritual-calm-energy-meditation-888hz-peaceful-231909/', 240, 6_000_000),
              ('quiet_meditation', 'https://pixabay.com/music/meditationspiritual-music-for-relax-yoga-meditation-7783/', 385, 10_000_000),
          ]

          def candidates_from_page(page_url):
              r = session.get(page_url, timeout=35)
              r.raise_for_status()
              text = html.unescape(r.text).replace('\\/', '/').replace('\\u0026', '&')
              patterns = [
                  r'https://cdn\.pixabay\.com/(?:download/)?audio/[^"\'<>\\s]+?\.mp3(?:\?[^"\'<>\\s]*)?',
                  r'https://cdn\.pixabay\.com/[^"\'<>\\s]+?\.mp3(?:\?[^"\'<>\\s]*)?',
              ]
              found = []
              for pattern in patterns:
                  found.extend(re.findall(pattern, text))
              unique = list(dict.fromkeys(found))
              unique.sort(key=lambda u: ('/download/audio/' not in u, len(u)))
              return unique

          def fetch_candidate(url, dest, min_size):
              try:
                  with session.get(url, stream=True, timeout=45, allow_redirects=True) as r:
                      r.raise_for_status()
                      content_type = r.headers.get('content-type', '')
                      with dest.open('wb') as f:
                          for chunk in r.iter_content(1024 * 1024):
                              if chunk:
                                  f.write(chunk)
                  if dest.stat().st_size >= min_size:
                      print('downloaded', dest.name, dest.stat().st_size, content_type, 'from', url.split('?')[0])
                      return True
              except Exception as e:
                  print('candidate failed:', type(e).__name__, str(e)[:180])
              dest.unlink(missing_ok=True)
              return False

          def ytdlp_fallback(page_url, dest):
              dest.unlink(missing_ok=True)
              cmd = [sys.executable, '-m', 'yt_dlp', '--no-playlist', '--no-progress',
                     '--user-agent', session.headers['User-Agent'], '-f', 'ba', '-o', str(dest), page_url]
              print('trying yt-dlp fallback for', page_url)
              result = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout[-4000:])
              return result.returncode == 0 and dest.exists()

          for name, page_url, expected_seconds, min_size in tracks:
              dest = out_dir / f'{name}.mp3'
              ok = False
              try:
                  for candidate in candidates_from_page(page_url):
                      if fetch_candidate(candidate, dest, min_size):
                          ok = True
                          break
              except Exception as e:
                  print('page scrape failed:', type(e).__name__, str(e)[:220])
              if not ok:
                  ok = ytdlp_fallback(page_url, dest)
              if not ok or not dest.exists() or dest.stat().st_size < min_size:
                  raise SystemExit(f'Could not retrieve original-quality MP3 for {name}')

              probe = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'a:0',
                  '-show_entries', 'stream=codec_name,bit_rate:format=duration',
                  '-of', 'default=noprint_wrappers=1', str(dest)
              ], text=True)
              print(name, probe.strip().replace('\n', ' | '))
              values = dict(line.split('=', 1) for line in probe.splitlines() if '=' in line)
              if values.get('codec_name') != 'mp3':
                  raise SystemExit(f'{name}: expected MP3, got {values.get("codec_name")}')
              duration = float(values.get('duration', '0'))
              if abs(duration - expected_seconds) > 4.0:
                  raise SystemExit(f'{name}: unexpected duration {duration}')
              bitrate = int(values.get('bit_rate', '0') or 0)
              if bitrate and bitrate < 240000:
                  raise SystemExit(f'{name}: bitrate unexpectedly low: {bitrate}')
          PYMUSIC

          grep -q 'versionCode = 282' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.2"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'R.raw.sea_harp' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'R.raw.calm_energy' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'R.raw.quiet_meditation' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java
          grep -q 'Три мелодии уже сохранены' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          ! grep -q 'soundRainCard' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          ! grep -R -q 'R.raw.rain_soft\|R.raw.ocean_swell\|R.raw.forest_evening\|R.raw.stream_flow' buildsrc/quiet-diary/app/src/main/java
          test -s buildsrc/quiet-diary/app/src/main/res/raw/sea_harp.mp3
          test -s buildsrc/quiet-diary/app/src/main/res/raw/calm_energy.mp3
          test -s buildsrc/quiet-diary/app/src/main/res/raw/quiet_meditation.mp3

          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PYXML

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-restore-log
          path: buildsrc/restore-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v282.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-compiler-log
          path: buildsrc/gradle-build-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.2-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.28.2-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.28.2-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-debug-apk
          path: Nightseed-0.28.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-release-unsigned-apk
          path: Nightseed-0.28.2-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-restored-source
          path: nightseed-0.28.2-restored-source.zip
          if-no-files-found: error
          retention-days: 7
