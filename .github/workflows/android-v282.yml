name: Build Nightseed 0.28.2 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.2 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v282.log) 2>&1
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/android-v281.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v281.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          bash /tmp/restore-nightseed-v281.sh

          cat source-v282/patch_* > buildsrc/v281-to-v282.patch.gz.b64
          test "$(wc -c < buildsrc/v281-to-v282.patch.gz.b64)" -eq 4460
          echo '64bef35708b6a1b3a5ac41e8470cdb52a6b8d6d5f12bb53e420cb28d646e8570  source-v282/patch_000' | sha256sum -c -
          echo '1332ae7b052cd6405f80650ce4ac92cf178a4285ea0ea170b4438ec2e42ca363  source-v282/patch_001' | sha256sum -c -
          base64 --decode buildsrc/v281-to-v282.patch.gz.b64 | gunzip > buildsrc/v281-to-v282.patch
          echo '4daafd0e04d8350856c5b317dbe541638ec524b8c3e575568bfab72c82d6366b  buildsrc/v281-to-v282.patch' | sha256sum -c -

          # The proven night-recognition stack must remain byte-for-byte outside this patch.
          ! grep -q 'NightCaptureService.java' buildsrc/v281-to-v282.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v281-to-v282.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v281-to-v282.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v281-to-v282.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v281-to-v282.patch
          rm -f buildsrc/quiet-diary/app/src/main/res/raw/rain_soft.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/ocean_swell.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/forest_evening.ogg \
                buildsrc/quiet-diary/app/src/main/res/raw/stream_flow.ogg

          # Pixabay blocks hosted CI runners. Build with tiny valid placeholders;
          # the exact user-supplied MP3 masters are injected after the APK is downloaded.
          mkdir -p buildsrc/quiet-diary/app/src/main/res/raw
          ffmpeg -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.25 -c:a libmp3lame -b:a 64k buildsrc/quiet-diary/app/src/main/res/raw/music_sea_harp.mp3
          cp buildsrc/quiet-diary/app/src/main/res/raw/music_sea_harp.mp3 buildsrc/quiet-diary/app/src/main/res/raw/music_calm_energy.mp3
          cp buildsrc/quiet-diary/app/src/main/res/raw/music_sea_harp.mp3 buildsrc/quiet-diary/app/src/main/res/raw/music_quiet_meditation.mp3

          grep -q 'versionCode = 282' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.2"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'Море и арфа' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          grep -q 'Спокойная энергия' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          grep -q 'Тихая медитация' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml
          ! grep -q 'Мягкий дождь' buildsrc/quiet-diary/app/src/main/res/layout/activity_sound_library.xml

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-restore-log
          path: buildsrc/restore-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain > buildsrc/gradle-build-v282.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-compiler-log
          path: buildsrc/gradle-build-v282.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts and signing kit
        shell: bash
        run: |
          set -euo pipefail
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.2-placeholder-debug.apk
          mkdir -p signing-kit
          cp "$HOME/.android/debug.keystore" signing-kit/debug.keystore
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-kit/apksigner.jar
          printf '%s\n' 'alias=androiddebugkey' 'storepass=android' 'keypass=android' > signing-kit/debug-signing.txt

      - name: Upload placeholder debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-placeholder-debug-apk
          path: Nightseed-0.28.2-placeholder-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-signing-kit
          path: signing-kit
          if-no-files-found: error
          retention-days: 7
