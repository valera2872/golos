name: Build Somnori 0.30.4 Showcase Polish

on:
  pull_request:
    branches: [ agent/v0-30-3-premium-pass-b ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.30.3 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v303-premium-pass-b.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.30.2.1 source',
              'Apply Premium Pass B',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              p = Path(f'/tmp/v304-base-{n}.sh')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(p)], check=True)
          PY

          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java \
            app/src/main/java/com/quietdiary/app/GoogleSpeechTranscriber.kt \
            app/src/main/java/com/quietdiary/app/NightCommandRouter.java \
            app/src/main/java/com/quietdiary/app/WakeTemplateStore.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/SettingsActivity.java \
            app/src/main/java/com/quietdiary/app/CouePracticeService.java \
            app/src/main/java/com/quietdiary/app/NightProgramService.java \
            app/src/main/java/com/quietdiary/app/MorningActivity.java \
            app/src/main/java/com/quietdiary/app/DreamHubActivity.java \
            app/src/main/java/com/quietdiary/app/SoundLibraryActivity.java \
            app/src/main/java/com/quietdiary/app/NightProgramActivity.java \
            app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java \
            app/src/main/java/com/quietdiary/app/WakeSettingsActivity.java \
            app/src/main/java/com/quietdiary/app/WakeAlarmActivity.java \
            > /tmp/v304-frozen-behavior.sha256

      - name: Apply Showcase Polish
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v304/apply_v304.py
          cd buildsrc/quiet-diary
          grep -q 'versionCode = 30040' app/build.gradle.kts
          grep -q 'versionName = "0.30.4"' app/build.gradle.kts
          grep -q 'SOMNORI · УТРО' app/src/main/res/layout/activity_morning.xml
          grep -q 'SOMNORI · СНЫ' app/src/main/res/layout/activity_dream_hub.xml
          grep -q 'SOMNORI · ЗВУК' app/src/main/res/layout/activity_sound_library.xml
          grep -q 'SOMNORI · МОЯ НОЧЬ' app/src/main/res/layout/activity_night_program.xml
          ! grep -q 'NIGHTSEED DREAMS' app/src/main/res/layout/activity_dream_hub.xml
          sha256sum -c /tmp/v304-frozen-behavior.sha256

          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('app/src/main')
          for p in (root/'res').rglob('*.xml'):
              ET.parse(p)
          pairs = [
              ('MorningActivity.java','activity_morning.xml'),
              ('DreamHubActivity.java','activity_dream_hub.xml'),
              ('SoundLibraryActivity.java','activity_sound_library.xml'),
              ('NightProgramActivity.java','activity_night_program.xml'),
          ]
          for java_name, layout_name in pairs:
              java=(root/'java/com/quietdiary/app'/java_name).read_text(encoding='utf-8')
              layout=(root/'res/layout'/layout_name).read_text(encoding='utf-8')
              ids=sorted(set(re.findall(r'R\.id\.([A-Za-z0-9_]+)', java)))
              missing=[i for i in ids if f'@+id/{i}' not in layout and f'@id/{i}' not in layout]
              assert not missing, (layout_name, missing)
          dream=(root/'res/layout/activity_dream_hub.xml').read_text(encoding='utf-8')
          sound=(root/'res/layout/activity_sound_library.xml').read_text(encoding='utf-8')
          night=(root/'res/layout/activity_night_program.xml').read_text(encoding='utf-8')
          morning=(root/'res/layout/activity_morning.xml').read_text(encoding='utf-8')
          assert 'premium_showcase_warm' in dream and 'premium_showcase_blue' in dream
          assert 'premium_showcase_blue' in sound and 'premium_showcase_warm' in sound
          assert 'premium_header_background' in night and 'ВАШ СЦЕНАРИЙ' in night
          assert 'ЛИЧНАЯ КАРТА' in morning and 'Ваши ночные находки' in morning
          for text in (dream,sound,night,morning):
              assert 'android:layout_height="172dp"' not in text
          print('0.30.4 Showcase Polish layout + behavior guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.30.4-showcase-polish-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.30.4-showcase-polish-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.4-showcase-polish-debug-apk
          path: Somnori-0.30.4-showcase-polish-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.4-showcase-polish-source
          path: Somnori-0.30.4-showcase-polish-source.zip
          retention-days: 14
