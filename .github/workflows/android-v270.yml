name: Build Nightseed 0.27.0 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.27.0 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v270.log) 2>&1
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v261.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.26.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v261.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          if ! bash /tmp/restore-nightseed-v261.sh; then
            echo 'Nightseed 0.26.1 restoration failed:'
            cat buildsrc/restore-v261.log 2>/dev/null || true
            exit 1
          fi

          cat source-v270/chunk000.b64 source-v270/chunk001.b64 source-v270/chunk002.b64 source-v270/chunk003.b64 source-v270/chunk004.b64 > buildsrc/v261-to-v270.patch.gz.b64
          base64 --decode buildsrc/v261-to-v270.patch.gz.b64 | gunzip > buildsrc/v261-to-v270.patch
          echo '57f82f139ecbbb01666dc307890b85b504c32fdd2e437c39de6f9c15935a0f2c  buildsrc/v261-to-v270.patch' | sha256sum -c -

          # 0.27 adds a separate media-only evening runner. Proven recognition stays frozen.
          ! grep -q 'NightCaptureService.java' buildsrc/v261-to-v270.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v261-to-v270.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v261-to-v270.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v261-to-v270.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v261-to-v270.patch
          ! grep -q 'CouePracticeService.java' buildsrc/v261-to-v270.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v261-to-v270.patch
          cp source-v270/night_summary_background.xml buildsrc/quiet-diary/app/src/main/res/drawable/night_summary_background.xml
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 270' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.27.0"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'class NightProgramActivity' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightProgramActivity.java
          grep -q 'class NightProgramService' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightProgramService.java
          grep -q 'optional Coué recording -> silence or user' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightProgramService.java
          grep -q 'attachProgramToActive' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightSessionStore.java
          grep -q 'Соберите переход ко сну' buildsrc/quiet-diary/app/src/main/res/layout/activity_night_program.xml
          grep -q 'Музыка и микрофон не работают одновременно' buildsrc/quiet-diary/app/src/main/res/layout/activity_night_program.xml
          grep -q 'Повторить сохранённую программу' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
          grep -q 'NightProgramService' buildsrc/quiet-diary/app/src/main/AndroidManifest.xml
          grep -q 'NightProgramToolsTest' buildsrc/quiet-diary/app/src/test/java/com/quietdiary/app/NightProgramToolsTest.java

          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PYXML

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.27.0-restore-log
          path: buildsrc/restore-v270.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v270.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.27.0-compiler-log
          path: buildsrc/gradle-build-v270.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.27.0-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.27.0-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.27.0-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.27.0-debug-apk
          path: Nightseed-0.27.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.27.0-release-unsigned-apk
          path: Nightseed-0.27.0-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.27.0-restored-source
          path: nightseed-0.27.0-restored-source.zip
          if-no-files-found: error
          retention-days: 7
