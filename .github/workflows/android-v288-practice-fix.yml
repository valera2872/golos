name: Build Nightseed 0.28.8 practice fix

on:
  pull_request:
    branches: [ agent/v0-28-5-ux-fix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.6 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/android-v286-buttons.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name, output):
              marker = f'      - name: {step_name}'
              start = lines.index(marker)
              run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
              Path(output).write_text(script, encoding='utf-8')

          extract('Restore Nightseed 0.28.5 project', '/tmp/run-v286-restore.sh')
          extract('Make all button labels adaptive', '/tmp/run-v286-buttons.sh')
          PY
          bash /tmp/run-v286-restore.sh
          bash /tmp/run-v286-buttons.sh

      - name: Apply 0.28.8 practice fixes and visual rollback
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v286-to-v288.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/v286-to-v288.patch.gz.b64 | gzip -d > /tmp/v286-to-v288.patch
          cd buildsrc/quiet-diary
          patch -p1 < /tmp/v286-to-v288.patch

          # Version and visual rollback guards: 0.28.8 must keep the 0.28.6 look.
          grep -q 'versionCode = 288' app/build.gradle.kts
          grep -q 'versionName = "0.28.8"' app/build.gradle.kts
          grep -q '<color name="qd_primary">#83E2C1</color>' app/src/main/res/values/colors.xml
          grep -q '<color name="qd_practice">#8ED8EA</color>' app/src/main/res/values/colors.xml
          ! grep -q 'Widget.QuietDiary.Button' app/src/main/res/values/themes.xml

          # Practice-flow regression guards.
          grep -q 'EXTRA_CONFIG_ONLY' app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java
          grep -q 'self_suggestion_auto_night' app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java
          grep -q 'suggestionAutoNightSwitch' app/src/main/res/layout/activity_self_suggestion.xml
          ! grep -q 'putBoolean(CouePracticeActivity.KEY_AUTO_NIGHT, false)' app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java
          ! grep -q 'nightStartNowButton).setEnabled(false)' app/src/main/java/com/quietdiary/app/NightProgramActivity.java
          ! grep -q 'nightStartDelayButton).setEnabled(false)' app/src/main/java/com/quietdiary/app/NightProgramActivity.java
          grep -q 'verifyNightCaptureStarted' app/src/main/java/com/quietdiary/app/NightProgramService.java
          grep -q 'verifyNightCaptureStarted' app/src/main/java/com/quietdiary/app/CouePracticeService.java
          ! grep -R -q 'CouePracticeActivity.class' app/src/main/java/com/quietdiary/app --exclude=CouePracticeActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(path)
          print('0.28.8 XML + practice regression guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.8-practice-fix-debug.apk
          cd buildsrc
          zip -qr ../Nightseed-0.28.8-restored-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.8-practice-fix-debug-apk
          path: Nightseed-0.28.8-practice-fix-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.8-restored-source
          path: Nightseed-0.28.8-restored-source.zip
          retention-days: 14
