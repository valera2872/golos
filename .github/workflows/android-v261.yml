name: Build Nightseed 0.26.1 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.26.1 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v261.log) 2>&1
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v260.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.26.0 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v260.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          if ! bash /tmp/restore-nightseed-v260.sh; then
            echo 'Nightseed 0.26.0 restoration failed:'
            cat buildsrc/restore-v260.log 2>/dev/null || true
            exit 1
          fi

          test "$(wc -c < source-v261/v260-to-v261.patch.gz.b64)" -eq 6137
          base64 --decode source-v261/v260-to-v261.patch.gz.b64 | gunzip > buildsrc/v260-to-v261.patch
          echo '102ec3a32a795dd1e4e3a4abc49c87aa83caa262dc755f2cff758fb689778bd0  buildsrc/v260-to-v261.patch' | sha256sum -c -

          # This release repairs TTS and practice UI only. The acoustic detector,
          # text verifier, voice templates and command recognizer remain unchanged.
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v260-to-v261.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v260-to-v261.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v260-to-v261.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v260-to-v261.patch
          ! grep -q 'CouePracticeService.java' buildsrc/v260-to-v261.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v260-to-v261.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 261' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.26.1"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'restartVoiceClock' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'rebuilding TTS and retrying once' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'голос не прозвучал' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'android:textColor="@color/qd_text" app:backgroundTint="@color/qd_practice"' buildsrc/quiet-diary/app/src/main/res/layout/activity_lucid_practice.xml
          grep -q 'Для голосового запуска осталось записать формулу своим голосом' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
          grep -q 'voiceStartButton.setEnabled(count >= CoueStartTemplateStore.REQUIRED_SAMPLES)' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java

          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PYXML

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.26.1-restore-log
          path: buildsrc/restore-v261.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v261.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.26.1-compiler-log
          path: buildsrc/gradle-build-v261.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.26.1-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.26.1-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.26.1-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.26.1-debug-apk
          path: Nightseed-0.26.1-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.26.1-release-unsigned-apk
          path: Nightseed-0.26.1-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.26.1-restored-source
          path: nightseed-0.26.1-restored-source.zip
          if-no-files-found: error
          retention-days: 7
