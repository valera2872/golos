name: Build Nightseed 0.25.4 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.4 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v254.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v253.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.3 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v253.sh').write_text(script, encoding='utf-8')
          PY
          if ! bash /tmp/restore-nightseed-v253.sh; then
            echo 'Nightseed 0.25.3 restoration failed:'
            cat buildsrc/restore-v253.log 2>/dev/null || true
            exit 1
          fi

          test "$(wc -c < source-v254/v253-to-v254.patch.gz.b64)" -eq 10704
          echo 'e4be867c808f2a0e8b3880bd9d618c5bf35e70fce988dbb07ce61a7a6e685cc7  source-v254/v253-to-v254.patch.gz.b64' | sha256sum -c -
          base64 --decode source-v254/v253-to-v254.patch.gz.b64 | gunzip > buildsrc/v253-to-v254.patch
          patch -p1 -d buildsrc/quiet-diary < buildsrc/v253-to-v254.patch
          patch -p1 -d buildsrc/quiet-diary < source-v254/coue-noise-gate-fix.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 254' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.25.4"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'NoiseSuppressor' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
          grep -q 'frameRms.length > 0 && frameRms\[0\] >= openLimit' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CoueVoiceProcessor.java
          grep -q 'Дневник снов' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java
          grep -q 'wake_phrase' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'Кодовая фраза должна состоять из 2–4 слов' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PY

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.4-restore-log
          path: buildsrc/restore-v254.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v254.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.4-compiler-log
          path: buildsrc/gradle-build-v254.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.4-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.4-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.4-debug-apk
          path: Nightseed-0.25.4-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.4-release-unsigned-apk
          path: Nightseed-0.25.4-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
