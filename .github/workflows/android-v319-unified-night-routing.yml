name: Build Somnori 0.31.9 Unified Night Routing

on:
  push:
    branches: [ agent/v0-31-9-unified-night-command-routing ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 0.31.8 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v318-practice-handoff.yml').read_text(encoding='utf-8').splitlines()
          names = [
              'Reconstruct exact 0.31.7 source',
              'Apply 0.31.8 practice listener handoff',
          ]
          for n, name in enumerate(names, 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              p = Path(f'/tmp/v319-base-{n}.sh')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(p)], check=True)
          PY

          ROOT=buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app
          grep -q 'versionCode = 30180' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.31.8-practice-handoff"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'private AcousticWakeDetector practiceDetector' "$ROOT/NightCaptureService.java"
          grep -q 'startPracticeTextVerification(practiceCandidate)' "$ROOT/NightCaptureService.java"
          grep -q 'handoffFromPracticeWait' "$ROOT/NightCaptureService.java"

      - name: Apply 0.31.9 unified command routing
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v319/apply_v319.py
          ROOT=buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app
          TESTS=buildsrc/quiet-diary/app/src/test/java/com/quietdiary/app

          grep -q 'versionCode = 30190' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.31.9-unified-night-routing"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'enum Kind { ENTRY, DREAM, TIME, ALARM, PRACTICE, STOP, NONE }' "$ROOT/NightCommandRouter.java"
          grep -q 'preferredAcousticGate == Kind.PRACTICE' "$ROOT/NightCommandRouter.java"
          grep -q 'practiceLabel, stopLabel, preferredKind' "$ROOT/NightCaptureService.java"
          grep -q 'completedPurpose == VerificationPurpose.PRACTICE' "$ROOT/NightCaptureService.java"
          ! grep -q 'completedPurpose != VerificationPurpose.PRACTICE' "$ROOT/NightCaptureService.java"

          # 31.8 microphone ownership fix and all six acoustic banks stay present.
          grep -q 'handoffFromPracticeWait' "$ROOT/NightCaptureService.java"
          grep -q 'WakeTemplateStore.loadEntryForDetection' "$ROOT/NightCaptureService.java"
          grep -q 'WakeTemplateStore.loadDreamForDetection' "$ROOT/NightCaptureService.java"
          grep -q 'WakeTemplateStore.loadTimeForDetection' "$ROOT/NightCaptureService.java"
          grep -q 'WakeTemplateStore.loadAlarmForDetection' "$ROOT/NightCaptureService.java"
          grep -q 'WakeTemplateStore.loadStopForDetection' "$ROOT/NightCaptureService.java"
          grep -q 'CoueStartTemplateStore.loadAll' "$ROOT/NightCaptureService.java"
          grep -q 'practiceGateCannotStealClock' "$TESTS/NightCommandRouterPracticeTest.java"
          grep -q 'practiceGateCannotStealAlarm' "$TESTS/NightCommandRouterPracticeTest.java"
          grep -q 'practiceGateCannotStealDream' "$TESTS/NightCommandRouterPracticeTest.java"
          grep -q 'practiceGateCannotStealDiaryEntry' "$TESTS/NightCommandRouterPracticeTest.java"
          grep -q 'practiceGateCannotStealStop' "$TESTS/NightCommandRouterPracticeTest.java"
          grep -q 'anotherGateRoutesFullPracticePhraseBackToPractice' "$TESTS/NightCommandRouterPracticeTest.java"

          echo '0.31.9 unified night routing guards: OK'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.31.9-Unified-Night-Routing-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.31.9-restored-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.31.9-unified-night-routing-apk
          path: Somnori-0.31.9-Unified-Night-Routing-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.31.9-restored-source
          path: Somnori-0.31.9-restored-source.zip
          retention-days: 14
