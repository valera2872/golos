name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete Android project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p buildsrc/quiet-diary
          {
            echo '=== source files ==='
            find source-v15 -maxdepth 1 -type f -name 'part*.b64' -printf '%f %s bytes\n' | sort
            echo '=== concatenate and decode ==='
            cat source-v15/part*.b64 > buildsrc/golos-source-0.15.b64
            wc -c buildsrc/golos-source-0.15.b64
            base64 --decode buildsrc/golos-source-0.15.b64 > buildsrc/golos-source-0.15.zip
            echo "base64_exit=$?"
            sha256sum buildsrc/golos-source-0.15.zip
            echo 'expected 8df847f96aac840048c1014321c9db2608aaa62b7ed7d3de135449ee92e1e346'
            echo '=== zip test ==='
            unzip -t buildsrc/golos-source-0.15.zip
            echo "zip_test_exit=$?"
            echo '=== extraction ==='
            unzip -qo buildsrc/golos-source-0.15.zip -d buildsrc/quiet-diary
            echo "unzip_exit=$?"
            find buildsrc/quiet-diary -maxdepth 3 -type f | sort | head -50
            test -f buildsrc/quiet-diary/settings.gradle.kts
            test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/ArchiveActivity.java
            test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java
            grep -q 'versionName = "0.15"' buildsrc/quiet-diary/app/build.gradle.kts
            echo 'RESTORE_OK'
          } > buildsrc/restore.log 2>&1

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-restore-log
          path: buildsrc/restore.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk golos-0.15-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk golos-0.15-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-debug-apk
          path: golos-0.15-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-release-unsigned-apk
          path: golos-0.15-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
