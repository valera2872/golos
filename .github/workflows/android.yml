name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc/quiet-diary
          cat source-v15/part*.b64 | base64 --decode > buildsrc/golos-source-0.15.zip
          unzip -q buildsrc/golos-source-0.15.zip -d buildsrc/quiet-diary
          test -f buildsrc/quiet-diary/settings.gradle.kts
          test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/ArchiveActivity.java
          test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java
          grep -q 'versionName = "0.15"' buildsrc/quiet-diary/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk golos-0.15-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk golos-0.15-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-debug-apk
          path: golos-0.15-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.15-release-unsigned-apk
          path: golos-0.15-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
