name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          cat source-v04/part*.b64 | base64 --decode > buildsrc/golos-source.zip
          unzip -q buildsrc/golos-source.zip -d buildsrc
          cat source-v05-patch/part*.b64 | base64 --decode | gunzip > buildsrc/v05.patch
          git apply -p2 --directory=buildsrc buildsrc/v05.patch
          cat source-v06-patch/part*.b64 | base64 --decode | gunzip > buildsrc/v06.patch
          git apply --directory=buildsrc/quiet-diary buildsrc/v06.patch
          cat source-v07-overlay/part*.b64 | base64 --decode > buildsrc/v07-overlay.zip
          unzip -qo buildsrc/v07-overlay.zip -d buildsrc/quiet-diary
          cat source-v08-overlay/part*.b64 | base64 --decode > buildsrc/v08-overlay.zip
          unzip -qo buildsrc/v08-overlay.zip -d buildsrc/quiet-diary
          cat source-v09-overlay/part*.b64 | base64 --decode > buildsrc/v09-overlay.tar.xz
          tar -xJf buildsrc/v09-overlay.tar.xz -C buildsrc/quiet-diary
          cp source-v09-hotfix/LiveCommandRecognizer.kt buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/LiveCommandRecognizer.kt
          test -f buildsrc/quiet-diary/settings.gradle.kts
          grep -q 'versionName = "0.9"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'runBlocking' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/LiveCommandRecognizer.kt
          test "$(grep -c '^package ' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/LiveCommandRecognizer.kt)" -eq 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary :app:assembleDebug --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.9-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Rename APK
        shell: bash
        run: cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk golos-0.9-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.9-debug-apk
          path: golos-0.9-debug.apk
          if-no-files-found: error
          retention-days: 30
