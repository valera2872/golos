name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Golos 0.20 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc/quiet-diary
          {
            cat source-v15/part*.b64 > buildsrc/golos-source-0.15.b64
            base64 --decode buildsrc/golos-source-0.15.b64 > buildsrc/golos-source-0.15.zip
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('buildsrc/golos-source-0.15.zip')
          target = Path('buildsrc/quiet-diary')
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC error: {bad}')
              zf.extractall(target)
          PY
            base64 --decode source-v15-hotfix/v15-hotfix.patch.gz.b64 | gunzip > buildsrc/v15-hotfix.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v15-hotfix.patch
            base64 --decode source-v16/v15-to-v16.patch.gz.b64 | gunzip > buildsrc/v15-to-v16.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v15-to-v16.patch
            cat source-v17-small/chunk*.b64 | base64 --decode | gunzip > buildsrc/v16-to-v17.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v16-to-v17.patch || true
            unexpected_rejects="$(find buildsrc/quiet-diary -name '*.rej' ! -path '*/README.md.rej' -print)"
            test -z "$unexpected_rejects"
            rm -f buildsrc/quiet-diary/README.md.rej
            base64 --decode source-v17-hotfix/dream-category.patch.gz.b64 | gunzip > buildsrc/v17-dream-category.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v17-dream-category.patch
            cat source-v18-fix/chunk00a.b64 source-v18-fix/chunk00b.b64 source-v18/chunk01.b64 source-v18/chunk02.b64 source-v18/chunk03.b64 | base64 --decode | gunzip > buildsrc/v17-to-v18.patch
            patch -p4 -d buildsrc/quiet-diary < buildsrc/v17-to-v18.patch

            cat source-v19-small/chunk*.b64 > buildsrc/v18-to-v19.patch.gz.b64
            test "$(wc -c < buildsrc/v18-to-v19.patch.gz.b64)" -eq 26852
            echo 'e8414ae22784cf5e0d1e84de0297e37588bd5fe20f3a1e0d8876674d4bee1e78  buildsrc/v18-to-v19.patch.gz.b64' | sha256sum -c -
            base64 --decode buildsrc/v18-to-v19.patch.gz.b64 | gunzip > buildsrc/v18-to-v19.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v18-to-v19.patch || true
            unexpected_rejects="$(find buildsrc/quiet-diary -name '*.rej' ! -path '*/README.md.rej' -print)"
            test -z "$unexpected_rejects"
            rm -f buildsrc/quiet-diary/README.md.rej
            patch -p1 -d buildsrc/quiet-diary < source-v19-hotfix/nav-attributes.patch

            cat source-v20/chunk*.b64 > buildsrc/v19-to-v20.patch.gz.b64
            test "$(wc -c < buildsrc/v19-to-v20.patch.gz.b64)" -eq 17872
            echo 'bd53567dae1732465e0992ed8d376c8953e7107a55d9a6931f6370de5ccc37b5  buildsrc/v19-to-v20.patch.gz.b64' | sha256sum -c -
            base64 --decode buildsrc/v19-to-v20.patch.gz.b64 | gunzip > buildsrc/v19-to-v20.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v19-to-v20.patch

            test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"
            grep -q 'versionName = "0.20"' buildsrc/quiet-diary/app/build.gradle.kts
            grep -q 'MODE_SPEAKING' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
            grep -q 'isTimeRequest' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/VoiceCommandMatcher.java
            grep -q 'Command.TIME' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/LiveCommandRecognizer.kt
            grep -q 'morningDreamCount' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
            grep -q 'ic_night' buildsrc/quiet-diary/app/src/main/res/layout/view_bottom_navigation.xml
            grep -q '#080D19' buildsrc/quiet-diary/app/src/main/res/values/colors.xml
            grep -q 'android:label="Golos"' buildsrc/quiet-diary/app/src/main/AndroidManifest.xml
          } > buildsrc/restore.log 2>&1

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.20-restore-log
          path: buildsrc/restore.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.20-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk golos-0.20-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk golos-0.20-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.20-debug-apk
          path: golos-0.20-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.20-release-unsigned-apk
          path: golos-0.20-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
