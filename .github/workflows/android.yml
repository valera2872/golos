name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Golos 0.17 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc/quiet-diary
          {
            cat source-v15/part*.b64 > buildsrc/golos-source-0.15.b64
            base64 --decode buildsrc/golos-source-0.15.b64 > buildsrc/golos-source-0.15.zip
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('buildsrc/golos-source-0.15.zip')
          target = Path('buildsrc/quiet-diary')
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC error: {bad}')
              zf.extractall(target)
          PY
            base64 --decode source-v15-hotfix/v15-hotfix.patch.gz.b64 | gunzip > buildsrc/v15-hotfix.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v15-hotfix.patch
            base64 --decode source-v16/v15-to-v16.patch.gz.b64 | gunzip > buildsrc/v15-to-v16.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v15-to-v16.patch
            cat source-v17-small/chunk*.b64 | base64 --decode | gunzip > buildsrc/v16-to-v17.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v16-to-v17.patch || true
            unexpected_rejects="$(find buildsrc/quiet-diary -name '*.rej' ! -path '*/README.md.rej' -print)"
            test -z "$unexpected_rejects"
            rm -f buildsrc/quiet-diary/README.md.rej
            test -f buildsrc/quiet-diary/settings.gradle.kts
            test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/DreamHubActivity.java
            test -f buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/DreamTools.java
            test -f buildsrc/quiet-diary/app/src/test/java/com/quietdiary/app/DreamToolsTest.java
            grep -q 'versionName = "0.17"' buildsrc/quiet-diary/app/build.gradle.kts
            grep -q 'REQUIRED_DREAM_SAMPLES' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeTemplateStore.java
            grep -q 'recordDreamSample' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeWordTrainer.java
            grep -q 'candidateLooksLikeDream' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
          } > buildsrc/restore.log 2>&1

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.17-restore-log
          path: buildsrc/restore.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.17-compiler-log
          path: buildsrc/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk golos-0.17-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk golos-0.17-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.17-debug-apk
          path: golos-0.17-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: golos-0.17-release-unsigned-apk
          path: golos-0.17-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
