name: Probe private Arina generation channel

on:
  push:
    branches: [ agent/v0-31-10-arina-recovery ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Verify secret and resolve Arina
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key=os.environ.get('ELEVENLABS_API_KEY','').strip()
          if not key:
              raise SystemExit('ELEVENLABS_API_KEY_MISSING')
          headers={'xi-api-key':key,'Accept':'application/json','User-Agent':'Somnori-Arina-Probe/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))
          sub=get('https://api.elevenlabs.io/v1/user/subscription')
          print('ELEVENLABS_SECRET_OK')
          print('tier=',sub.get('tier'),'status=',sub.get('status'),'used=',sub.get('character_count'),'limit=',sub.get('character_limit'))
          candidates=[]
          try:
              p=urllib.parse.urlencode({'search':'Arina','page_size':100})
              data=get('https://api.elevenlabs.io/v2/voices?'+p)
              for v in data.get('voices',[]):
                  if (v.get('name') or '').strip().casefold()=='arina':
                      candidates.append({'voice_id':v.get('voice_id'),'name':v.get('name'),'category':v.get('category'),'labels':v.get('labels') or {},'source':'account'})
          except Exception as e:
              print('account_search_warning=',type(e).__name__)
          if not candidates:
              try:
                  p=urllib.parse.urlencode({'search':'Arina','language':'ru','page_size':100})
                  data=get('https://api.elevenlabs.io/v1/shared-voices?'+p)
                  for v in data.get('voices',[]):
                      if (v.get('name') or '').strip().casefold()=='arina':
                          candidates.append({'voice_id':v.get('voice_id'),'name':v.get('name'),'category':v.get('category'),'language':v.get('language'),'accent':v.get('accent'),'description':v.get('descriptive'),'source':'voice-library'})
              except Exception as e:
                  print('library_search_warning=',type(e).__name__)
          print('ARINA_CANDIDATES='+json.dumps(candidates,ensure_ascii=False))
          if not candidates:
              raise SystemExit('ARINA_NOT_FOUND')
          PY
