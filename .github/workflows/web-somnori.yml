name: Build Somnori web

on:
  push:
    branches: [ agent/somnori-web-v1, agent/somnori-web-v2, agent/somnori-web-v2-1, agent/somnori-web-v2-2, agent/somnori-web-v2-9-ru-real-screens ]
    paths:
      - 'web/**'
      - '.github/workflows/web-somnori.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-somnori.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Validate EN/RU launch, positioning and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('web/dist')
          assert root.exists(), 'dist/ missing'

          expected = [
              '/', '/ru',
              '/voice-dream-journal', '/hands-free-dream-journal',
              '/remember-dreams', '/dream-journal', '/privacy', '/terms',
          ]
          localized = {'/':'en','/ru':'ru'}
          hidden_locales = ['/es','/de','/fr','/tr']

          def output_for(path: str):
              clean = path.strip('/')
              if not clean:
                  return root / 'index.html'
              candidates = [root / clean / 'index.html', root / f'{clean}.html']
              for candidate in candidates:
                  if candidate.exists():
                      return candidate
              return candidates[0]

          for route in expected:
              page = output_for(route)
              assert page.exists(), f'missing built page for {route}: {page}'
              html = page.read_text(encoding='utf-8')
              canonical = 'https://somnori.com/' if route == '/' else f'https://somnori.com{route}'
              assert f'rel="canonical" href="{canonical}"' in html or f'href="{canonical}" rel="canonical"' in html, f'canonical missing for {route}'
              assert '<h1' in html.lower(), f'H1 missing for {route}'
              if route in localized:
                  lang = localized[route]
                  assert f'<html lang="{lang}"' in html, f'html lang missing for {route}'
                  for alt in ['en','ru']:
                      assert f'hreflang="{alt}"' in html, f'hreflang {alt} missing for {route}'
                  for hidden in ['es','de','fr','tr']:
                      assert f'hreflang="{hidden}"' not in html, f'hidden hreflang {hidden} leaked into {route}'
                  assert 'hreflang="x-default"' in html, f'x-default missing for {route}'

          for route in hidden_locales:
              assert not output_for(route).exists(), f'prepared locale must not be public yet: {route}'

          root_html = output_for('/').read_text(encoding='utf-8')
          ru_html = output_for('/ru').read_text(encoding='utf-8')

          for marker in ['English', 'Русский']:
              assert marker in root_html, f'language switcher missing {marker}'
          for forbidden in ['Español', 'Deutsch', 'Français', 'Türkçe']:
              assert forbidden not in root_html, f'prepared language leaked into switcher: {forbidden}'

          assert 'current Android build is in Russian' in root_html, 'English availability disclosure missing'
          assert 'проходит тестирование' in ru_html, 'Russian testing disclosure missing'

          for marker in [
              'Keep what comes to you at night',
              'The idea at 2:47 AM can be more valuable than the dream',
              'What time is it?',
              'Voice alarm',
              'Build the night you want to enter',
              'NEXT PRODUCT LAYER',
              'Dream layer',
              'One night system',
          ]:
              assert marker in root_html, f'English positioning marker missing: {marker}'

          for marker in [
              'Не теряйте то, что приходит к вам ночью',
              'Идея в 2:47 ночи может быть ценнее приснившегося сна',
              'Сколько времени?',
              'Голосовой будильник',
              'Соберите ночь, в которую хотите войти',
              'ЕСТЬ В ТЕКУЩЕЙ СБОРКЕ',
              'Утром всё, что пришло ночью, снова перед вами',
              'Слой сновидений',
              'Одна система ночи',
          ]:
              assert marker in ru_html, f'Russian positioning marker missing: {marker}'

          # EN keeps neutral placeholders until a real English APK exists.
          assert 'Real product screenshot slot' in root_html
          assert 'data-screenshot-slot=' in root_html

          # RU uses the real 0.30.4 screens. Shared CSS may contain RU selectors on both pages;
          # only rendered phone markup is forbidden from the English page.
          real_screens = ['home','assistant','routine','sounds','wake','morning','dreams']
          for screen in real_screens:
              marker = f'data-screenshot-slot="ru-real-{screen}"'
              assert marker in ru_html, f'RU real screenshot missing: {screen}'
              assert marker not in root_html, f'RU real screenshot rendered on EN homepage: {screen}'
          for forbidden in [
              'Главный экран Somnori 0.30.4 на русском языке',
              'Ночной помощник Somnori: микрофон готов',
              'Экран Somnori «Как я хочу проснуться»',
          ]:
              assert forbidden not in root_html, f'RU screenshot alt text rendered on EN homepage: {forbidden}'

          sprite = root / 'screens' / 'ru' / 'somnori-0.30.4-sprite.webp'
          assert sprite.exists(), 'RU real screenshot sprite missing'
          assert sprite.stat().st_size < 260_000, f'RU sprite too large: {sprite.stat().st_size}'

          robots = root / 'robots.txt'
          assert robots.exists(), 'robots.txt missing'
          robots_text = robots.read_text(encoding='utf-8')
          assert 'Sitemap: https://somnori.com/sitemap-index.xml' in robots_text
          assert (root / 'sitemap-index.xml').exists(), 'sitemap-index.xml missing'

          sitemap_text = ''.join(p.read_text(encoding='utf-8') for p in root.glob('sitemap*.xml'))
          for route in hidden_locales:
              assert f'https://somnori.com{route}' not in sitemap_text, f'hidden locale leaked into sitemap: {route}'

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  for key, value in attrs:
                      if key == 'href' and value: self.hrefs.append(value)

          broken=[]
          for html_file in root.rglob('*.html'):
              parser=Links(); parser.feed(html_file.read_text(encoding='utf-8'))
              for href in parser.hrefs:
                  if href.startswith(('#','mailto:','tel:')): continue
                  parsed=urlparse(href)
                  if parsed.scheme or parsed.netloc: continue
                  path=parsed.path
                  if not path or not path.startswith('/'): continue
                  if path.startswith('/_astro/'): continue
                  target=output_for(path)
                  if not target.exists(): broken.append((str(html_file.relative_to(root)), href))
          assert not broken, 'broken internal links: ' + repr(broken[:20])

          assert not output_for('/tools/dream-interpreter').exists(), 'dream interpreter placeholder must not be published yet'

          print('Somnori Web v2.9 validation OK')
          print('Validated pages:', len(expected))
          print('Public languages: EN, RU')
          print('EN screenshots: neutral placeholders')
          print('RU screenshots: real 0.30.4 product screens')
          PY

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: somnori-web-dist
          path: web/dist
          retention-days: 14
