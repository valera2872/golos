name: Build Nightseed 0.28.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-v283.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.3 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v283.log) 2>&1

          python3 - <<'PYRESTORE'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/android-v282.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.2 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v282.sh').write_text(script, encoding='utf-8')
          PYRESTORE
          bash /tmp/restore-nightseed-v282.sh

          python3 - <<'PYFIX'
          from pathlib import Path
          import html
          import re
          import xml.etree.ElementTree as ET

          root = Path('buildsrc/quiet-diary')
          gradle_path = root / 'app/build.gradle.kts'
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = re.sub(r'versionCode\s*=\s*282\b', 'versionCode = 283', gradle)
          gradle = gradle.replace('versionName = "0.28.2"', 'versionName = "0.28.3"')
          gradle_path.write_text(gradle, encoding='utf-8')

          layout_dir = root / 'app/src/main/res/layout'
          button_re = re.compile(r'<com\.google\.android\.material\.button\.MaterialButton\b.*?/>', re.S)
          fixed = []

          def repair(block, path):
              text_match = re.search(r'android:text="([^"]+)"', block)
              height_match = re.search(r'android:layout_height="(\d+)dp"', block)
              if not text_match or not height_match:
                  return block
              raw_label = text_match.group(1)
              if raw_label.startswith('@'):
                  return block
              label = html.unescape(raw_label).strip()
              # Short fixed-height controls are intentional. Long action labels must grow vertically.
              if len(label) < 18:
                  return block
              old_height = height_match.group(1)
              changed = re.sub(r'android:layout_height="\d+dp"', 'android:layout_height="wrap_content"', block, count=1)
              indent_match = re.search(r'\n(\s+)android:layout_height=', changed)
              indent = indent_match.group(1) if indent_match else '        '
              if 'android:minHeight=' not in changed:
                  changed = changed.replace('android:layout_height="wrap_content"',
                      'android:layout_height="wrap_content"\n' + indent + f'android:minHeight="{old_height}dp"', 1)
              if 'android:maxLines=' not in changed:
                  changed = changed.replace(f'android:minHeight="{old_height}dp"',
                      f'android:minHeight="{old_height}dp"\n' + indent + 'android:maxLines="3"', 1)
              if 'android:singleLine="true"' in changed:
                  changed = changed.replace('android:singleLine="true"', 'android:singleLine="false"')
              changed = re.sub(r'\n\s*android:ellipsize="(?:end|middle|start|marquee)"', '', changed)
              fixed.append((path.name, label, old_height))
              return changed

          for path in sorted(layout_dir.glob('*.xml')):
              source = path.read_text(encoding='utf-8')
              updated = button_re.sub(lambda m: repair(m.group(0), path), source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          # Guard the exact button that was visibly clipped during device testing.
          sound_path = layout_dir / 'activity_sound_library.xml'
          sound = sound_path.read_text(encoding='utf-8')
          exact = re.search(r'<com\.google\.android\.material\.button\.MaterialButton\b[^>]*android:text="Добавить выбранную мелодию в ночную программу"[^>]*/>', sound, re.S)
          assert exact, 'Sound-library action button not found'
          assert 'android:layout_height="wrap_content"' in exact.group(0)
          assert 'android:maxLines="3"' in exact.group(0)

          # Validate all XML after the mechanical repair.
          for path in layout_dir.glob('*.xml'):
              ET.parse(path)

          assert fixed, 'No long fixed-height buttons were repaired'
          print('Repaired long fixed-height buttons:', len(fixed))
          for filename, label, height in fixed:
              print(f'  {filename}: {height}dp -> wrap_content :: {label}')
          PYFIX

          grep -q 'versionCode = 283' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.3"' buildsrc/quiet-diary/app/build.gradle.kts
          ! grep -q 'NightCaptureService.java' /dev/null

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.3-restore-log
          path: buildsrc/restore-v283.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain > buildsrc/gradle-build-v283.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.3-compiler-log
          path: buildsrc/gradle-build-v283.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.3-debug.apk
          cd buildsrc
          zip -qr ../nightseed-0.28.3-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.3-debug-apk
          path: Nightseed-0.28.3-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload restored source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.3-restored-source
          path: nightseed-0.28.3-restored-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Record CI result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-v283/ci-result
          cat > source-v283/ci-result/status.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          commit=${GITHUB_SHA}
          restore=success
          compile=success
          EOF
          cp buildsrc/restore-v283.log source-v283/ci-result/restore.log
          cp buildsrc/gradle-build-v283.log source-v283/ci-result/compiler.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-v283/ci-result
          git commit -m "Record Nightseed 0.28.3 CI result ${GITHUB_RUN_ID}"
          git push
