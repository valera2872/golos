name: Build Somnori 0.30.1 night UI state hotfix

on:
  pull_request:
    branches: [ agent/v0-30-morning ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact accepted Somnori 0.30 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v300-morning.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.29.8 source',
              'Apply 0.29.10 fixes then 0.30 Morning',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              p = Path(f'/tmp/v301-base-{n}.sh')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(p)], check=True)
          PY

          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java \
            app/src/main/java/com/quietdiary/app/GoogleSpeechTranscriber.kt \
            app/src/main/java/com/quietdiary/app/NightCommandRouter.java \
            app/src/main/java/com/quietdiary/app/WakeTemplateStore.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/SettingsActivity.java \
            app/src/main/java/com/quietdiary/app/CouePracticeService.java \
            app/src/main/java/com/quietdiary/app/NightProgramService.java \
            app/src/main/java/com/quietdiary/app/MorningActivity.java \
            app/src/main/java/com/quietdiary/app/MorningTools.java \
            > /tmp/v301-frozen-core.sha256

      - name: Apply 0.30.1 UI state synchronization hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v301/apply_v301.py
          cd buildsrc/quiet-diary

          grep -q 'versionCode = 3001' app/build.gradle.kts
          grep -q 'versionName = "0.30.1"' app/build.gradle.kts
          grep -q 'nightAssistantMicStatus' app/src/main/res/layout/activity_night_assistant.xml
          grep -q 'МИКРОФОН · ВЫКЛ' app/src/main/res/layout/activity_night_assistant.xml
          grep -q 'stopButton.setVisibility(serviceRunning ? View.VISIBLE : View.GONE)' app/src/main/java/com/quietdiary/app/NightAssistantActivity.java
          grep -q 'micStatus.setText(serviceRunning ? "МИКРОФОН · ВКЛ" : "МИКРОФОН · ВЫКЛ")' app/src/main/java/com/quietdiary/app/NightAssistantActivity.java
          test "$(grep -c 'private void syncServiceStateFromPreferences' app/src/main/java/com/quietdiary/app/NightAssistantActivity.java)" = "1"
          test "$(grep -c 'private void syncServiceStateFromPreferences' app/src/main/java/com/quietdiary/app/MainActivity.java)" = "1"
          grep -A12 '@Override protected void onStart()' app/src/main/java/com/quietdiary/app/MainActivity.java | grep -q 'syncServiceStateFromPreferences'

          # Recognition, routing, audio and night-practice core must stay byte-identical to accepted 0.30.
          sha256sum -c /tmp/v301-frozen-core.sha256

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main/res')
          for p in root.rglob('*.xml'):
              ET.parse(p)
          night = Path('app/src/main/java/com/quietdiary/app/NightAssistantActivity.java').read_text(encoding='utf-8')
          main = Path('app/src/main/java/com/quietdiary/app/MainActivity.java').read_text(encoding='utf-8')
          assert 'stopButton.setVisibility(serviceRunning ? View.VISIBLE : View.GONE)' in night
          assert 'МИКРОФОН · ВКЛ' in night and 'МИКРОФОН · ВЫКЛ' in night
          assert 'syncServiceStateFromPreferences(getSharedPreferences("settings", MODE_PRIVATE));' in main
          print('0.30.1 UI-state guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.30.1-night-ui-state-audio-slots-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.30.1-night-ui-state-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.1-night-ui-state-audio-slots-debug-apk
          path: Somnori-0.30.1-night-ui-state-audio-slots-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.1-night-ui-state-source
          path: Somnori-0.30.1-night-ui-state-source.zip
          retention-days: 14
