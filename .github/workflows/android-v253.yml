name: Build Nightseed 0.25.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.3 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v253.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v252.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.2 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v252.sh').write_text(script, encoding='utf-8')
          PY
          if ! bash /tmp/restore-nightseed-v252.sh; then
            echo 'Nightseed 0.25.2 restoration failed:'
            cat buildsrc/restore-v252.log 2>/dev/null || true
            exit 1
          fi

          cat source-v253/chunk000.b64 source-v253-small/part*.b64 > buildsrc/v252-to-v253.patch.gz.b64
          test "$(wc -c < buildsrc/v252-to-v253.patch.gz.b64)" -eq 22224
          echo 'e2411a45a73f3714ce864ced9816b519094888947a1498cb959b930ebef22770  buildsrc/v252-to-v253.patch.gz.b64' | sha256sum -c -
          base64 --decode buildsrc/v252-to-v253.patch.gz.b64 | gunzip > buildsrc/v252-to-v253.patch
          patch -p2 -d buildsrc/quiet-diary < buildsrc/v252-to-v253.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionName = "0.25.3"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'MIN_REQUIRED_SAMPLES = 3' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeTemplateStore.java
          grep -q 'MAX_REQUIRED_SAMPLES = 5' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeTemplateStore.java
          grep -q 'assessTraining' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/WakeTemplateStore.java
          grep -q 'bedside_test_passed' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java
          grep -q 'Научим Nightseed узнавать именно вас' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'Не дайте ночной мысли исчезнуть' buildsrc/quiet-diary/app/src/main/res/layout/activity_main.xml
          grep -q 'MAX_WAKE_VERIFICATION_BUFFER_SAMPLES = SAMPLE_RATE \* 12' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PY

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.3-restore-log
          path: buildsrc/restore-v253.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v253.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.3-compiler-log
          path: buildsrc/gradle-build-v253.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.3-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.3-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.3-debug-apk
          path: Nightseed-0.25.3-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.3-release-unsigned-apk
          path: Nightseed-0.25.3-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
