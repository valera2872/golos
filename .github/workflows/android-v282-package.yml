name: Package Nightseed 0.28.2 for master audio

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore 0.28.2 with placeholder audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          lines = Path('.github/workflows/android-v282.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.2 project'
          start = lines.index(marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
          Path('/tmp/restore-v282.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/restore-v282.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create dedicated debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Nightseed Debug,O=Nightseed,C=ME" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.android/debug.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build placeholder APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain
          test -s buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaging tools
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare injection kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p injection-kit
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk injection-kit/Nightseed-0.28.2-placeholder-debug.apk
          cp "$HOME/.android/debug.keystore" injection-kit/debug.keystore
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" injection-kit/apksigner.jar
          cat > injection-kit/README.txt <<'EOF'
          Replace these APK entries with the user-supplied original MP3 masters, then re-sign:
          res/raw/music_sea_harp.mp3
          res/raw/music_calm_energy.mp3
          res/raw/music_quiet_meditation.mp3
          Keystore alias: androiddebugkey
          Store/key password: android
          EOF

      - name: Upload injection kit
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.2-master-audio-injection-kit
          path: injection-kit
          if-no-files-found: error
          retention-days: 7
