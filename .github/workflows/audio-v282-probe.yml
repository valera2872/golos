name: Probe Nightseed 0.28.2 audio sources

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public audio mirrors
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet yt-dlp
          mkdir -p /tmp/music
          yt-dlp -v --no-playlist -f ba -o /tmp/music/calm.mp3 'https://audio.com/xuan-lethithanhsnvbt/audio/calm-energy-meditation-888hz-peaceful-231909'
          yt-dlp -v --no-playlist -f ba -o /tmp/music/quiet.mp3 'https://audio.com/chandani/audio/music-for-relax-yoga-meditation-7783'
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/music/nature.mp3 'https://rituels-quatre-saisons.fr/wp-content/uploads/2024/06/meditation-and-gentle-nature-184572.mp3'
          ls -lh /tmp/music
          for f in /tmp/music/*; do ffprobe -v error -show_entries stream=codec_name,bit_rate -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"; done
