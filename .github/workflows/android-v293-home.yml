name: Build Somnori 0.29.3 home workspace

on:
  pull_request:
    branches: [ agent/v0-29-1-voice-alarm ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.29.2 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v291-voice-alarm.yml').read_text(encoding='utf-8').splitlines()
          steps = [
              'Restore exact Somnori 0.29.0 project',
              'Apply Somnori 0.29.1 voice alarm patch',
              'Preserve Somnori 0.29 master audio slots and library UI',
              'Apply Somnori 0.29.2 alarm reliability and dashboard patch',
          ]
          for n, name in enumerate(steps, 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              path = Path(f'/tmp/v293-base-{n}.sh')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(path)], check=True)
          PY
          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java > /tmp/v293-frozen-recognition.sha256

      - name: Apply Somnori 0.29.3 home workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum buildsrc/v293/patch.gz.b64 | awk '{print $1}')" = "a53b9b55d4d61e48180537d072af98a6d7f5bd74f62f5f0f6bfd94c3605d6b51"
          base64 -d buildsrc/v293/patch.gz.b64 | gzip -dc > /tmp/v293.patch
          test "$(sha256sum /tmp/v293.patch | awk '{print $1}')" = "e237a12770ed3fd686e96a8882330e2044a5f63a398c9d31e1f81025a5a0c75a"
          cd buildsrc/quiet-diary
          patch -p1 < /tmp/v293.patch

          grep -q 'versionCode = 2903' app/build.gradle.kts
          grep -q 'versionName = "0.29.3"' app/build.gradle.kts
          grep -q 'Ночной помощник' app/src/main/res/layout/activity_main.xml
          grep -q 'Голосом — без касания телефона' app/src/main/res/layout/activity_main.xml
          grep -q 'Сегодня ночью' app/src/main/res/layout/activity_main.xml
          grep -q 'Впервые в Somnori?' app/src/main/res/layout/activity_main.xml
          grep -q 'dashboardStartNightButton' app/src/main/java/com/quietdiary/app/MainActivity.java
          grep -q 'renderHomeDashboard' app/src/main/java/com/quietdiary/app/MainActivity.java
          ! grep -q 'if (!prefs.getBoolean("onboarding_v257_seen"' app/src/main/java/com/quietdiary/app/MainActivity.java

          # 0.29.3 is UI/information architecture only: recognition core must be byte-identical to 0.29.2.
          sha256sum -c /tmp/v293-frozen-recognition.sha256
          grep -q 'SAFE_END_SILENCE_BLOCKS = 11' app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java
          ! grep -q 'transcribeSamplesFast' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'alarmDetector = new AcousticWakeDetector' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'private static final long PAUSE_MS = 3000L;' app/src/main/java/com/quietdiary/app/CouePracticeService.java
          grep -q 'private static final long COUE_PAUSE_MS = 3000L;' app/src/main/java/com/quietdiary/app/NightProgramService.java

          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('app/src/main/res')
          for p in root.rglob('*.xml'):
              ET.parse(p)
          main = (root/'layout/activity_main.xml').read_text(encoding='utf-8')
          for expected in [
              'Что вы хотите сделать?',
              'Ночной помощник',
              'Голосом — без касания телефона',
              'Запись мыслей и снов  •  время  •  будильник',
              'Практики', 'Перед сном', 'Сегодня ночью', 'Мои сны', 'Впервые в Somnori?'
          ]:
              assert expected in main, expected
          # Keep the accepted adaptive-button rule.
          for p in (root/'layout').rglob('*.xml'):
              text = p.read_text(encoding='utf-8')
              for block in re.findall(r'<com\.google\.android\.material\.button\.MaterialButton\b.*?/>', text, re.S):
                  assert not re.search(r'android:layout_height="\d+dp"', block), f'fixed-height button: {p.name}'
          print('Somnori 0.29.3 home guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          for entry in res/raw/music_sea_harp.mp3 res/raw/music_calm_energy.mp3 res/raw/music_quiet_meditation.mp3 res/raw/nature_forest.mp3; do
            unzip -l "$APK" "$entry" | grep -q "$entry"
          done
          cp "$APK" Somnori-0.29.3-home-workspace-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.29.3-home-workspace-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.3-home-workspace-debug-apk
          path: Somnori-0.29.3-home-workspace-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.3-home-workspace-source
          path: Somnori-0.29.3-home-workspace-source.zip
          retention-days: 14
