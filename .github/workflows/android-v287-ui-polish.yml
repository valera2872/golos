name: Build Nightseed 0.28.7 UI polish

on:
  pull_request:
    branches: [ agent/v0-28-5-ux-fix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore Nightseed 0.28.6 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/android-v286-buttons.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name, output):
              marker = f'      - name: {step_name}'
              start = lines.index(marker)
              run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
              Path(output).write_text(script, encoding='utf-8')

          extract('Restore Nightseed 0.28.5 project', '/tmp/run-v286-restore.sh')
          extract('Make all button labels adaptive', '/tmp/run-v286-buttons.sh')
          PY
          bash /tmp/run-v286-restore.sh
          bash /tmp/run-v286-buttons.sh

      - name: Apply 0.28.7 visual polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('buildsrc/quiet-diary')
          res = root / 'app/src/main/res'
          values = res / 'values'

          (values / 'colors.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="qd_background">#060A14</color>
              <color name="qd_background_soft">#0B1222</color>
              <color name="qd_surface">#10192A</color>
              <color name="qd_surface_alt">#17243A</color>
              <color name="qd_surface_glass">#CC111B2E</color>
              <color name="qd_text">#F2F0E9</color>
              <color name="qd_muted">#A7B3C3</color>
              <color name="qd_primary">#A8D1BF</color>
              <color name="qd_primary_dark">#243830</color>
              <color name="qd_accent">#213632</color>
              <color name="qd_warning">#E8BD82</color>
              <color name="qd_danger">#E7A3AA</color>
              <color name="qd_recording">#FF9A8D</color>
              <color name="qd_success">#A8D1BF</color>
              <color name="qd_border">#2A3B57</color>
              <color name="qd_border_bright">#536D8A</color>
              <color name="qd_chip">#1B2A41</color>
              <color name="qd_night">#0B1630</color>
              <color name="qd_night_soft">#203B64</color>
              <color name="qd_on_night">#FBFAF5</color>
              <color name="qd_on_night_muted">#C9D5E8</color>
              <color name="qd_dream">#C9B0FF</color>
              <color name="qd_dream_soft">#261F42</color>
              <color name="qd_practice">#86B7BC</color>
              <color name="qd_practice_dark">#274149</color>
              <color name="qd_practice_soft">#15313A</color>
              <color name="qd_time">#E7C78F</color>
              <color name="qd_time_soft">#3B2E19</color>
              <color name="qd_nav_selected">#21363A</color>
              <color name="qd_nav_icon">#92A2BA</color>
              <color name="qd_transparent">#00000000</color>
          </resources>
          ''', encoding='utf-8')

          (values / 'styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Widget.QuietDiary.Button" parent="Widget.MaterialComponents.Button">
                  <item name="android:textAllCaps">false</item>
                  <item name="android:textColor">@color/qd_primary_dark</item>
                  <item name="android:textSize">15sp</item>
                  <item name="android:fontFamily">sans-serif-medium</item>
                  <item name="android:minHeight">56dp</item>
                  <item name="android:paddingLeft">18dp</item>
                  <item name="android:paddingRight">18dp</item>
                  <item name="android:paddingTop">14dp</item>
                  <item name="android:paddingBottom">14dp</item>
                  <item name="cornerRadius">20dp</item>
                  <item name="backgroundTint">@color/qd_primary</item>
                  <item name="rippleColor">@color/qd_border_bright</item>
                  <item name="elevation">0dp</item>
                  <item name="android:insetTop">0dp</item>
                  <item name="android:insetBottom">0dp</item>
              </style>

              <style name="Widget.QuietDiary.Button.Outlined" parent="Widget.MaterialComponents.Button.OutlinedButton">
                  <item name="android:textAllCaps">false</item>
                  <item name="android:textColor">@color/qd_text</item>
                  <item name="android:textSize">15sp</item>
                  <item name="android:fontFamily">sans-serif-medium</item>
                  <item name="android:minHeight">56dp</item>
                  <item name="android:paddingLeft">18dp</item>
                  <item name="android:paddingRight">18dp</item>
                  <item name="android:paddingTop">14dp</item>
                  <item name="android:paddingBottom">14dp</item>
                  <item name="cornerRadius">20dp</item>
                  <item name="strokeColor">@color/qd_border_bright</item>
                  <item name="strokeWidth">1dp</item>
                  <item name="backgroundTint">@color/qd_surface_glass</item>
                  <item name="rippleColor">@color/qd_border_bright</item>
                  <item name="elevation">0dp</item>
                  <item name="android:insetTop">0dp</item>
                  <item name="android:insetBottom">0dp</item>
              </style>
          </resources>
          ''', encoding='utf-8')

          themes_path = values / 'themes.xml'
          themes = themes_path.read_text(encoding='utf-8')
          themes = themes.replace(
              '<item name="materialButtonStyle">@style/Widget.MaterialComponents.Button</item>',
              '<item name="materialButtonStyle">@style/Widget.QuietDiary.Button</item>\n'
              '        <item name="materialButtonOutlinedStyle">@style/Widget.QuietDiary.Button.Outlined</item>'
          )
          if '@style/Widget.QuietDiary.Button' not in themes:
              raise SystemExit('Could not install QuietDiary button styles in theme')
          themes_path.write_text(themes, encoding='utf-8')

          (res / 'drawable/icon_button_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#B3141E31" />
              <stroke android:width="1dp" android:color="#36516B" />
              <corners android:radius="18dp" />
          </shape>
          ''', encoding='utf-8')

          (res / 'drawable/nav_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="270" android:startColor="#141E2F" android:endColor="#0F1727" />
              <stroke android:width="1dp" android:color="@color/qd_border" />
              <corners android:topLeftRadius="28dp" android:topRightRadius="28dp" />
          </shape>
          ''', encoding='utf-8')

          nav_path = res / 'layout/view_bottom_navigation.xml'
          nav = nav_path.read_text(encoding='utf-8')
          nav = nav.replace('android:layout_height="78dp"', 'android:layout_height="82dp"')
          nav = nav.replace('android:paddingStart="7dp"', 'android:paddingStart="8dp"')
          nav = nav.replace('android:paddingTop="7dp"', 'android:paddingTop="8dp"')
          nav = nav.replace('android:paddingEnd="7dp"', 'android:paddingEnd="8dp"')
          nav = nav.replace('android:paddingBottom="8dp"', 'android:paddingBottom="10dp"')
          nav = nav.replace('android:layout_height="match_parent" android:layout_weight="1"', 'android:layout_height="60dp" android:layout_weight="1"')
          nav = nav.replace('app:cornerRadius="18dp"', 'app:cornerRadius="22dp"')
          nav = nav.replace('android:textSize="10sp"', 'android:textSize="10.5sp"')
          nav_path.write_text(nav, encoding='utf-8')

          archive_path = root / 'app/src/main/java/com/quietdiary/app/ArchiveActivity.java'
          archive = archive_path.read_text(encoding='utf-8')
          archive = archive.replace(
              'int text = selected ? android.R.color.white : R.color.qd_primary;',
              'int text = selected ? R.color.qd_primary_dark : R.color.qd_primary;'
          )
          archive_path.write_text(archive, encoding='utf-8')

          ui_path = root / 'app/src/main/java/com/quietdiary/app/UiNavigation.java'
          ui = ui_path.read_text(encoding='utf-8')
          ui = ui.replace(
              'int text = selected ? R.color.qd_primary : R.color.qd_nav_icon;',
              'int text = selected ? R.color.qd_text : R.color.qd_nav_icon;'
          )
          ui_path.write_text(ui, encoding='utf-8')

          button_re = re.compile(
              r'<(?:com\.google\.android\.material\.button\.MaterialButton|androidx\.appcompat\.widget\.AppCompatButton|android\.widget\.Button|Button)\b.*?/>',
              re.S,
          )

          def set_attr(block, attr, value):
              pattern = re.compile(re.escape(attr) + r'="[^"]*"')
              replacement = f'{attr}="{value}"'
              if pattern.search(block):
                  return pattern.sub(replacement, block, count=1)
              m = re.search(r'android:textAllCaps="[^"]*"', block)
              if m:
                  return block[:m.end()] + '\n                    ' + replacement + block[m.end():]
              return block.replace('/>', '\n                    ' + replacement + ' />', 1)

          def polish_button(block):
              # Softer silhouette: avoid the old squared tile look.
              m = re.search(r'app:cornerRadius="(\d+)dp"', block)
              if m and int(m.group(1)) < 20:
                  block = set_attr(block, 'app:cornerRadius', '20dp')

              # Dark text on filled accents. Never white/blue-on-green.
              if 'app:backgroundTint="@color/qd_primary"' in block:
                  block = set_attr(block, 'android:textColor', '@color/qd_primary_dark')
              elif 'app:backgroundTint="@color/qd_practice"' in block:
                  block = set_attr(block, 'android:textColor', '@color/qd_practice_dark')
              elif 'app:backgroundTint="@color/qd_time"' in block:
                  block = set_attr(block, 'android:textColor', '@color/qd_primary_dark')
              return block

          for path in sorted((res / 'layout').glob('*.xml')):
              source = path.read_text(encoding='utf-8')
              if path.name == 'view_bottom_navigation.xml':
                  # Already tuned separately; keep its 22dp selected pills.
                  updated = source
              else:
                  updated = button_re.sub(lambda m: polish_button(m.group(0)), source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          gp = root / 'app/build.gradle.kts'
          gradle = gp.read_text(encoding='utf-8')
          gradle = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 287', gradle, count=1)
          gradle = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.28.7"', gradle, count=1)
          gp.write_text(gradle, encoding='utf-8')

          failures = []
          for path in sorted((res / 'layout').glob('*.xml')):
              source = path.read_text(encoding='utf-8')
              for m in button_re.finditer(source):
                  block = m.group(0)
                  if 'app:backgroundTint="@color/qd_primary"' in block and 'android:textColor="@color/qd_primary_dark"' not in block:
                      failures.append(f'{path.name}: primary fill without dark text')
                  if 'app:backgroundTint="@color/qd_practice"' in block and 'android:textColor="@color/qd_practice_dark"' not in block:
                      failures.append(f'{path.name}: practice fill without dark text')
                  if 'app:backgroundTint="@color/qd_time"' in block and 'android:textColor="@color/qd_primary_dark"' not in block:
                      failures.append(f'{path.name}: time fill without dark text')
                  if re.search(r'android:layout_height="\d+dp"', block):
                      failures.append(f'{path.name}: fixed button height returned')
                  if 'android:singleLine="true"' in block or 'android:maxLines="1"' in block:
                      failures.append(f'{path.name}: button text constrained to one line')

          if 'android.R.color.white' in archive_path.read_text(encoding='utf-8'):
              failures.append('ArchiveActivity.java: white selected-filter text remains')

          for path in res.rglob('*.xml'):
              ET.parse(path)

          if failures:
              raise SystemExit('UI polish guards failed:\n' + '\n'.join(failures))

          print('0.28.7 UI polish guards: OK')
          print('No white text on filled green/teal controls; adaptive labels preserved.')
          PY

          grep -q 'versionCode = 287' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.28.7"' buildsrc/quiet-diary/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.7-ui-polish-debug.apk
          cd buildsrc
          zip -qr ../Nightseed-0.28.7-restored-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.7-ui-polish-debug-apk
          path: Nightseed-0.28.7-ui-polish-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.7-restored-source
          path: Nightseed-0.28.7-restored-source.zip
          retention-days: 14
