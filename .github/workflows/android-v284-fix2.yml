name: Build Nightseed 0.28.4 UX APK fixed

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore 0.28.4 from primary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          lines = Path('.github/workflows/android-v284.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.28.4 project'
          start = lines.index(marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(lines[run_line + 1:end])) + '\n'
          Path('/tmp/restore-v284.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/restore-v284.sh

      - name: Normalize Material text-button style
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl '?attr/materialButtonTextButtonStyle' buildsrc/quiet-diary/app/src/main/res/layout \
            | xargs -r sed -i 's#?attr/materialButtonTextButtonStyle#@style/Widget.MaterialComponents.Button.TextButton#g'
          ! grep -R '?attr/materialButtonTextButtonStyle' buildsrc/quiet-diary/app/src/main/res/layout

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain | tee buildsrc/gradle-build-v284-fixed.log

      - name: Prepare placeholder APK
        run: cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.28.4-placeholder-debug.apk

      - name: Upload placeholder APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.4-placeholder-debug-apk-fixed
          path: Nightseed-0.28.4-placeholder-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.28.4-compiler-log-fixed
          path: buildsrc/gradle-build-v284-fixed.log
          if-no-files-found: warn
          retention-days: 7
