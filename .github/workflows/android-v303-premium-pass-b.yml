name: Build Somnori 0.30.3 Premium Pass B

on:
  pull_request:
    branches: [ agent/v0-30-2-1-responsive-fix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.30.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v3021-responsive-fix.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.30.2 Premium Pass A source',
              'Apply responsive no-clipping fix',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              p = Path(f'/tmp/v303-base-{n}.sh')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(p)], check=True)
          PY

          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java \
            app/src/main/java/com/quietdiary/app/GoogleSpeechTranscriber.kt \
            app/src/main/java/com/quietdiary/app/NightCommandRouter.java \
            app/src/main/java/com/quietdiary/app/WakeTemplateStore.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/SettingsActivity.java \
            app/src/main/java/com/quietdiary/app/CouePracticeService.java \
            app/src/main/java/com/quietdiary/app/NightProgramService.java \
            app/src/main/java/com/quietdiary/app/MorningActivity.java \
            app/src/main/java/com/quietdiary/app/MorningTools.java \
            app/src/main/java/com/quietdiary/app/SelfSuggestionActivity.java \
            app/src/main/java/com/quietdiary/app/WakeSettingsActivity.java \
            app/src/main/java/com/quietdiary/app/WakeAlarmActivity.java \
            > /tmp/v303-frozen-core-and-logic.sha256

      - name: Apply Premium Pass B
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v303/apply_v303.py
          cd buildsrc/quiet-diary

          grep -q 'versionCode = 30030' app/build.gradle.kts
          grep -q 'versionName = "0.30.3"' app/build.gradle.kts
          grep -q 'SOMNORI · САМОВНУШЕНИЕ' app/src/main/res/layout/activity_self_suggestion.xml
          grep -q 'Настройте фразу на ночь' app/src/main/res/layout/activity_self_suggestion.xml
          grep -q 'ВАШ ГОЛОС · ВАША ФРАЗА' app/src/main/res/layout/activity_self_suggestion.xml
          grep -q 'SOMNORI · ПРОБУЖДЕНИЕ' app/src/main/res/layout/activity_wake_settings.xml
          grep -q 'После сигнала' app/src/main/res/layout/activity_wake_settings.xml
          grep -q 'Что дальше?' app/src/main/res/layout/activity_wake_settings.xml
          grep -q 'SOMNORI · ДОБРОЕ УТРО' app/src/main/res/layout/activity_wake_alarm.xml

          # Premium pass is presentation-only: all behavior classes stay byte-identical.
          sha256sum -c /tmp/v303-frozen-core-and-logic.sha256

          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('app/src/main')
          for p in (root/'res').rglob('*.xml'):
              ET.parse(p)

          pairs = [
              ('SelfSuggestionActivity.java', 'activity_self_suggestion.xml'),
              ('WakeSettingsActivity.java', 'activity_wake_settings.xml'),
              ('WakeAlarmActivity.java', 'activity_wake_alarm.xml'),
          ]
          for java_name, layout_name in pairs:
              java = (root/'java/com/quietdiary/app'/java_name).read_text(encoding='utf-8')
              layout = (root/'res/layout'/layout_name).read_text(encoding='utf-8')
              ids = sorted(set(re.findall(r'R\.id\.([A-Za-z0-9_]+)', java)))
              missing = [i for i in ids if f'@+id/{i}' not in layout and f'@id/{i}' not in layout]
              assert not missing, (layout_name, missing)

          suggestion = (root/'res/layout/activity_self_suggestion.xml').read_text(encoding='utf-8')
          wake = (root/'res/layout/activity_wake_settings.xml').read_text(encoding='utf-8')
          alarm = (root/'res/layout/activity_wake_alarm.xml').read_text(encoding='utf-8')
          assert 'Самовнушение — это способ' not in suggestion
          assert 'android:layout_height="172dp"' not in suggestion
          assert 'android:maxLines="2"' in suggestion
          assert 'premium_header_background' in suggestion and 'premium_training_background' in suggestion
          assert 'premium_header_background' in wake and 'premium_showcase_warm' in wake and 'premium_showcase_blue' in wake
          assert 'premium_header_background' in alarm and 'surface_glass_background' in alarm
          print('0.30.3 Premium Pass B layout + behavior guards: OK')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.30.3-premium-pass-b-debug.apk
          cd buildsrc
          zip -qr ../Somnori-0.30.3-premium-pass-b-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.3-premium-pass-b-debug-apk
          path: Somnori-0.30.3-premium-pass-b-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.3-premium-pass-b-source
          path: Somnori-0.30.3-premium-pass-b-source.zip
          retention-days: 14
