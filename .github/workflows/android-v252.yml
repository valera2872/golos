name: Build Nightseed 0.25.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.2 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v251.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.1 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v251.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/restore-nightseed-v251.sh
          {
            cat source-v252/chunk*.b64 > buildsrc/v251-to-v252.patch.gz.b64
            test "$(wc -c < buildsrc/v251-to-v252.patch.gz.b64)" -eq 16284
            echo '5d8c392d7606ff841020e0dbe22814139647c55286972f2fdf8af28be5b96d38  buildsrc/v251-to-v252.patch.gz.b64' | sha256sum -c -
            base64 --decode buildsrc/v251-to-v252.patch.gz.b64 | gunzip > buildsrc/v251-to-v252.patch
            patch -p1 -d buildsrc/quiet-diary < buildsrc/v251-to-v252.patch
            find buildsrc/quiet-diary -name '*.orig' -delete
            test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

            grep -q 'versionName = "0.25.2"' buildsrc/quiet-diary/app/build.gradle.kts
            grep -q 'KEY_VOICE_FORMULA_TEXT' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
            grep -q 'SpeechRecognizer' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
            grep -q 'MAX_WAKE_VERIFICATION_BUFFER_SAMPLES = SAMPLE_RATE \* 12' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
            grep -q 'START_RECORDING, SAVED, CANCELLED, READY' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/NightCaptureService.java
            grep -q 'coueVoiceFormulaInput' buildsrc/quiet-diary/app/src/main/res/layout/activity_coue_practice.xml
            grep -q 'coueVoiceStartButton' buildsrc/quiet-diary/app/src/main/res/layout/activity_coue_practice.xml
            grep -q 'coueAutoNightSwitch' buildsrc/quiet-diary/app/src/main/res/layout/activity_coue_practice.xml

            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          PY
          } > buildsrc/restore-v252.log 2>&1

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.2-restore-log
          path: buildsrc/restore-v252.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v252.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.2-compiler-log
          path: buildsrc/gradle-build-v252.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.2-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.2-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.2-debug-apk
          path: Nightseed-0.25.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.2-release-unsigned-apk
          path: Nightseed-0.25.2-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
