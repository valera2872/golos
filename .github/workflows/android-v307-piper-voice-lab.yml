name: Prepare Somnori 0.30.7 Piper Voice Lab

on:
  pull_request:
    branches: [ agent/v0-30-6-voice-lab ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-piper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download official sherpa-onnx Piper Russian APKs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-new/1.13.4'
          mkdir -p piper-apks
          curl -L --fail --retry 4 --retry-delay 3 \
            "$BASE/sherpa-onnx-1.13.4-arm64-v8a-rus-tts-vits-piper-ru_RU-irina-medium.apk" \
            -o piper-apks/Somnori-Piper-Irina-test.apk
          curl -L --fail --retry 4 --retry-delay 3 \
            "$BASE/sherpa-onnx-1.13.4-arm64-v8a-rus-tts-vits-piper-ru_RU-denis-medium.apk" \
            -o piper-apks/Somnori-Piper-Denis-test.apk
          curl -L --fail --retry 4 --retry-delay 3 \
            "$BASE/sherpa-onnx-1.13.4-arm64-v8a-rus-tts-vits-piper-ru_RU-dmitri-medium.apk" \
            -o piper-apks/Somnori-Piper-Dmitri-test.apk
          curl -L --fail --retry 4 --retry-delay 3 \
            "$BASE/sherpa-onnx-1.13.4-arm64-v8a-rus-tts-vits-piper-ru_RU-ruslan-medium.apk" \
            -o piper-apks/Somnori-Piper-Ruslan-test.apk

      - name: Verify APK containers and record hashes
        shell: bash
        run: |
          set -euo pipefail
          for apk in piper-apks/*.apk; do
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
          done
          sha256sum piper-apks/*.apk | tee piper-apks/SHA256SUMS.txt
          du -h piper-apks/*.apk | tee piper-apks/SIZES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-piper-irina-test-apk
          path: piper-apks/Somnori-Piper-Irina-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-piper-denis-test-apk
          path: piper-apks/Somnori-Piper-Denis-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-piper-dmitri-test-apk
          path: piper-apks/Somnori-Piper-Dmitri-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-piper-ruslan-test-apk
          path: piper-apks/Somnori-Piper-Ruslan-test.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-piper-test-checksums
          path: |
            piper-apks/SHA256SUMS.txt
            piper-apks/SIZES.txt
          retention-days: 14
