name: Generate Somnori Chatterbox V3 Russian samples

on:
  pull_request:
    branches: [ agent/v0-30-6-voice-lab ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-chatterbox-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch and Chatterbox
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install chatterbox-tts==0.1.7

      - name: Generate Russian Somnori samples with Chatterbox Multilingual V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatterbox-samples
          python - <<'PY'
          import time
          from pathlib import Path
          import torchaudio as ta
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          out = Path('chatterbox-samples')
          print('Loading Chatterbox Multilingual V3 on CPU...')
          t0 = time.time()
          model = ChatterboxMultilingualTTS.from_pretrained(device='cpu', t3_model='v3')
          print(f'Model loaded in {time.time()-t0:.1f}s at {model.sr} Hz')

          text = 'Сейчас два двадцать семь. Хорошо. Будильник на семь тридцать. Доброе утро. Пора просыпаться.'
          profiles = [
              ('01_default', 0.50, 0.50),
              ('02_calm',    0.30, 0.35),
              ('03_soft',    0.20, 0.25),
          ]
          for name, exaggeration, cfg in profiles:
              print(f'Generating {name}: exaggeration={exaggeration}, cfg={cfg}')
              t1 = time.time()
              wav = model.generate(
                  text,
                  language_id='ru',
                  exaggeration=exaggeration,
                  cfg_weight=cfg,
                  temperature=0.75,
                  repetition_penalty=1.2,
              )
              ta.save(str(out / f'{name}.wav'), wav, model.sr)
              print(f'{name} generated in {time.time()-t1:.1f}s')

          (out/'README.txt').write_text(
              'Somnori Chatterbox Multilingual V3 Russian baseline samples\n'
              'Text: Сейчас два двадцать семь. Хорошо. Будильник на семь тридцать. Доброе утро. Пора просыпаться.\n\n'
              '01_default.wav — exaggeration 0.50, cfg_weight 0.50\n'
              '02_calm.wav    — exaggeration 0.30, cfg_weight 0.35\n'
              '03_soft.wav    — exaggeration 0.20, cfg_weight 0.25\n\n'
              'No voice clone/reference is used in this baseline test.\n'
              'If baseline naturalness is promising, next test will use a 6–10 second Russian reference clip with consent.\n',
              encoding='utf-8'
          )
          PY

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          for wav in chatterbox-samples/*.wav; do
            test -s "$wav"
          done
          sha256sum chatterbox-samples/*.wav > chatterbox-samples/SHA256SUMS.txt
          ls -lh chatterbox-samples

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-chatterbox-v3-russian-samples
          path: chatterbox-samples
          retention-days: 14
