name: Build Somnori 0.30 Morning

on:
  pull_request:
    branches: [ agent/v0-29-1-voice-alarm ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.29.8 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v296-premium-night-console.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate(['Restore exact Somnori 0.29.5 project','Apply Somnori 0.29.6 premium visuals and night console'],1):
              marker=f'      - name: {name}'
              start=src.index(marker)
              run_line=next(i for i in range(start,len(src)) if src[i].strip()=='run: |')
              end=next(i for i in range(run_line+1,len(src)) if src[i].startswith('      - ') and i>run_line+1)
              script=textwrap.dedent('\n'.join(src[run_line+1:end]))+'\n'
              p=Path(f'/tmp/v300-base-{n}.sh'); p.write_text(script,encoding='utf-8')
              subprocess.run(['bash',str(p)],check=True)
          PY
          python3 buildsrc/v297/apply_concept_home.py
          python3 buildsrc/v297/strip_unsupported_insets.py
          python3 buildsrc/v298/apply_text_fit.py

          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java \
            app/src/main/java/com/quietdiary/app/GoogleSpeechTranscriber.kt \
            app/src/main/java/com/quietdiary/app/NightCommandRouter.java \
            app/src/main/java/com/quietdiary/app/WakeTemplateStore.java \
            app/src/main/java/com/quietdiary/app/NightAssistantActivity.java \
            app/src/main/java/com/quietdiary/app/SettingsActivity.java \
            app/src/main/java/com/quietdiary/app/CouePracticeService.java \
            app/src/main/java/com/quietdiary/app/NightProgramService.java \
            > /tmp/v300-frozen-core.sha256

      - name: Apply 0.29.9 then 0.30 Morning
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v299/apply_v299.py
          python3 buildsrc/v300/apply_v300.py
          cd buildsrc/quiet-diary
          grep -q 'versionCode = 3000' app/build.gradle.kts
          grep -q 'versionName = "0.30.0"' app/build.gradle.kts
          grep -q 'SAFE_END_SILENCE_BLOCKS = 11' app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java
          grep -q 'SAFE_END_SILENCE_BLOCKS = 11' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'configureSomnoriVoice' app/src/main/java/com/quietdiary/app/NightCaptureService.java
          grep -q 'class MorningActivity' app/src/main/java/com/quietdiary/app/MorningActivity.java
          grep -q 'latestCompletedNight' app/src/main/java/com/quietdiary/app/MorningTools.java
          grep -q 'dashboardMorningCard' app/src/main/res/layout/activity_main.xml
          grep -q 'morningEntriesContainer' app/src/main/res/layout/activity_morning.xml
          grep -q 'MorningActivity' app/src/main/AndroidManifest.xml
          ! grep -q 'somnori_practice_scene' app/src/main/res/layout/activity_main.xml
          ! grep -q 'somnori_sleep_scene' app/src/main/res/layout/activity_main.xml
          sha256sum -c /tmp/v300-frozen-core.sha256

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and placeholder APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare 0.30 artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Somnori-0.30.0-morning-audio-slots-debug.apk
          cd buildsrc && zip -qr ../Somnori-0.30.0-morning-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.0-morning-audio-slots-debug-apk
          path: Somnori-0.30.0-morning-audio-slots-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.30.0-morning-source
          path: Somnori-0.30.0-morning-source.zip
          retention-days: 14
