name: Build Somnori 0.29.7 concept home

on:
  pull_request:
    branches: [ agent/v0-29-1-voice-alarm ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Somnori 0.29.6 project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/android-v296-premium-night-console.yml').read_text(encoding='utf-8').splitlines()
          for n, name in enumerate([
              'Restore exact Somnori 0.29.5 project',
              'Apply Somnori 0.29.6 premium visuals and night console',
          ], 1):
              marker = f'      - name: {name}'
              start = src.index(marker)
              run_line = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
              end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - ') and i > run_line + 1)
              script = textwrap.dedent('\n'.join(src[run_line + 1:end])) + '\n'
              path = Path(f'/tmp/v297-base-{n}.sh')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['bash', str(path)], check=True)
          PY

          cd buildsrc/quiet-diary
          sha256sum \
            app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java \
            app/src/main/java/com/quietdiary/app/NightCaptureService.java \
            app/src/main/java/com/quietdiary/app/RussianAlarmCommandParser.java \
            app/src/main/java/com/quietdiary/app/GoogleSpeechTranscriber.kt \
            app/src/main/java/com/quietdiary/app/NightCommandRouter.java \
            app/src/main/java/com/quietdiary/app/WakeTemplateStore.java \
            app/src/main/java/com/quietdiary/app/NightAssistantActivity.java \
            app/src/main/java/com/quietdiary/app/SettingsActivity.java \
            app/src/main/java/com/quietdiary/app/CouePracticeService.java \
            app/src/main/java/com/quietdiary/app/NightProgramService.java \
            app/src/main/res/raw/music_sea_harp.mp3 \
            app/src/main/res/raw/music_calm_energy.mp3 \
            app/src/main/res/raw/music_quiet_meditation.mp3 \
            app/src/main/res/raw/nature_forest.mp3 \
            > /tmp/v297-frozen-core-and-audio.sha256

      - name: Apply Somnori 0.29.7 concept home
        shell: bash
        run: |
          set -euo pipefail
          python3 buildsrc/v297/apply_concept_home.py

          cd buildsrc/quiet-diary
          grep -q 'versionCode = 2907' app/build.gradle.kts
          grep -q 'versionName = "0.29.7"' app/build.gradle.kts
          grep -q 'SAFE_END_SILENCE_BLOCKS = 11' app/src/main/java/com/quietdiary/app/AcousticWakeDetector.java
          grep -q 'dashboardNightButton.setText(serviceRunning ? "Открыть" : "Включить")' app/src/main/java/com/quietdiary/app/MainActivity.java
          grep -q 'nightLivePanel.setVisibility(View.GONE)' app/src/main/java/com/quietdiary/app/MainActivity.java
          grep -q 'trainingControlsRecovery' app/src/main/java/com/quietdiary/app/SettingsActivity.java
          grep -q 'Микрофон готов · жду команду' app/src/main/java/com/quietdiary/app/NightAssistantActivity.java
          grep -q 'int background = android.R.color.transparent;' app/src/main/java/com/quietdiary/app/UiNavigation.java
          grep -q 'somnori_assistant_scene' app/src/main/res/layout/activity_main.xml
          grep -q 'somnori_practice_scene' app/src/main/res/layout/activity_main.xml
          grep -q 'somnori_sleep_scene' app/src/main/res/layout/activity_main.xml
          grep -q 'somnori_dream_scene' app/src/main/res/layout/activity_main.xml
          ! grep -q '<bitmap' app/src/main/res/drawable/somnori_assistant_card_background.xml
          ! grep -q '<bitmap' app/src/main/res/drawable/somnori_practice_card_background.xml
          ! grep -q '<bitmap' app/src/main/res/drawable/somnori_sleep_card_background.xml
          ! grep -q '<bitmap' app/src/main/res/drawable/somnori_dream_card_background.xml

          # Nothing below the visual/navigation layer may drift.
          sha256sum -c /tmp/v297-frozen-core-and-audio.sha256

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests and APK
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Prepare 0.29.7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for entry in res/raw/music_sea_harp.mp3 res/raw/music_calm_energy.mp3 res/raw/music_quiet_meditation.mp3 res/raw/nature_forest.mp3; do
            unzip -l "$APK" "$entry" | grep -q "$entry"
          done
          cp "$APK" Somnori-0.29.7-concept-home-debug.apk
          sha256sum Somnori-0.29.7-concept-home-debug.apk | tee Somnori-0.29.7-concept-home-debug.sha256
          cd buildsrc
          zip -qr ../Somnori-0.29.7-concept-home-source.zip quiet-diary

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.7-concept-home-debug-apk
          path: |
            Somnori-0.29.7-concept-home-debug.apk
            Somnori-0.29.7-concept-home-debug.sha256
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: somnori-0.29.7-concept-home-source
          path: Somnori-0.29.7-concept-home-source.zip
          retention-days: 14
