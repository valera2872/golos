name: Build Nightseed 0.25.6 APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Nightseed 0.25.6 project
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          exec > >(tee buildsrc/restore-v256.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/android-v255.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Restore Nightseed 0.25.5 project'
          start_step = workflow.index(marker)
          run_line = next(i for i in range(start_step, len(workflow)) if workflow[i].strip() == 'run: |')
          end_step = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: Upload restore log'))
          script = textwrap.dedent('\n'.join(workflow[run_line + 1:end_step])) + '\n'
          Path('/tmp/restore-nightseed-v255.sh').write_text(script, encoding='utf-8')
          PY
          if ! bash /tmp/restore-nightseed-v255.sh; then
            echo 'Nightseed 0.25.5 restoration failed:'
            cat buildsrc/restore-v255.log 2>/dev/null || true
            exit 1
          fi

          test "$(wc -c < source-v256/v255-to-v256.patch.gz.b64)" -eq 5680
          echo '9234b1f06bf37faa23dd3986d9434202a4f1ec4baaa6720afe754cd1c7793da5  source-v256/v255-to-v256.patch.gz.b64' | sha256sum -c -
          base64 --decode source-v256/v255-to-v256.patch.gz.b64 | gunzip > buildsrc/v255-to-v256.patch
          echo '375aab6f7192cd0eac691e8c5fb0d3be424b75b3ac9153f4a15f42cd3c0c2145  buildsrc/v255-to-v256.patch' | sha256sum -c -

          # Recognition was explicitly frozen after successful physical-device testing.
          ! grep -q 'NightCaptureService.java' buildsrc/v255-to-v256.patch
          ! grep -q 'GoogleSpeechTranscriber.kt' buildsrc/v255-to-v256.patch
          ! grep -q 'AcousticWakeDetector.java' buildsrc/v255-to-v256.patch
          ! grep -q 'LiveCommandRecognizer.kt' buildsrc/v255-to-v256.patch
          ! grep -q 'WakeTemplateStore.java' buildsrc/v255-to-v256.patch

          patch -p1 -d buildsrc/quiet-diary < buildsrc/v255-to-v256.patch
          find buildsrc/quiet-diary -name '*.orig' -delete
          test -z "$(find buildsrc/quiet-diary -name '*.rej' -print)"

          grep -q 'versionCode = 256' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'versionName = "0.25.6"' buildsrc/quiet-diary/app/build.gradle.kts
          grep -q 'savedWakePhrase = "Дневник запись"' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/SettingsActivity.java
          grep -q 'Запиши заметку' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'Сохрани мысль' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'Отдельная команда для записи сна' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'не запускает ночной режим' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml
          grep -q 'Готовлю микрофон для обучения' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
          grep -q 'serviceActive' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeActivity.java
          grep -q 'Включаю ночной режим' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/CouePracticeService.java
          ! grep -q 'Дневник снов' buildsrc/quiet-diary/app/src/main/java/com/quietdiary/app/OnboardingActivity.java
          ! grep -q 'android:text="Дневник снов"' buildsrc/quiet-diary/app/src/main/res/layout/activity_settings.xml

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('buildsrc/quiet-diary/app/src/main/AndroidManifest.xml')
          for path in Path('buildsrc/quiet-diary/app/src/main/res/layout').glob('*.xml'):
              ET.parse(path)
          for path in Path('buildsrc/quiet-diary/app/src/main/res/drawable').glob('*.xml'):
              ET.parse(path)
          PY

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.6-restore-log
          path: buildsrc/restore-v256.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after restore log upload
        if: steps.restore.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        id: compile
        continue-on-error: true
        shell: bash
        run: gradle -p buildsrc/quiet-diary testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > buildsrc/gradle-build-v256.log 2>&1

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.6-compiler-log
          path: buildsrc/gradle-build-v256.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail after compiler log upload
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Prepare artifacts
        run: |
          cp buildsrc/quiet-diary/app/build/outputs/apk/debug/app-debug.apk Nightseed-0.25.6-debug.apk
          cp buildsrc/quiet-diary/app/build/outputs/apk/release/app-release-unsigned.apk Nightseed-0.25.6-release-unsigned.apk
          cd buildsrc
          zip -qr ../nightseed-0.25.6-restored-source.zip quiet-diary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.6-debug-apk
          path: Nightseed-0.25.6-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.6-release-unsigned-apk
          path: Nightseed-0.25.6-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: nightseed-0.25.6-restored-source
          path: nightseed-0.25.6-restored-source.zip
          if-no-files-found: error
          retention-days: 7
